id = "chokuzen-n2-05-06"
level = "N2"

[question]
text = "彼は自分でも認めている（　）、確かにあきっぽい。"
choices = ["だけあって", "ばかりか", "ことから", "というより"]
correct = "だけあって"

[grammar]
main = "〜だけあって（不愧是／正因为是）"
related = ["〜ことから", "〜ばかりか", "〜というより"]
tags = [
    "level/N2",
    "grammar/だけあって",
    "function/原因・評価",
    "pattern/普通形＋だけあって"
]

# 📘 〜だけあって
# 含义：正因为是……所以（果然／确实）……。带有称赞或符合期待的语气。
# 接续：名词／普通形（ナ形容词＋な）＋だけあって
# 例句：彼はプロだけあって、仕事が早い。
# 本题中「彼は自分でも認めているだけあって」＝“他自己都承认了，也难怪确实容易厌倦”。

# 🚫 〜ことから
# 含义：因为……由此得知／因此命名（多用于客观说明）
# 例句：富士山が見えることから、「富士見町」と呼ばれている。
# 本题不是客观说明，而是对人的评价，不能用ことから。
