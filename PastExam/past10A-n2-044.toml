id = "past10A-n2-044"
level = "N2"
mistaskes = 2 

[question]
text = "残業が続いて体を壊した時に、自分の人生は（　）と思って、転職を決めた。"
choices = [
    "このままならいいのではないか",
    "このままがいいのではないか",
    "このままよりいいのだろうか",
    "このままでいいのだろうか"
]
correct = "このままでいいのだろうか"

[grammar]
main = "～のだろうか（自问自省的疑问表达）"
related = ["～のではないか（推测・轻断定）"]
tags = [
    "level/N2",
    "grammar/のだろうか",
    "function/疑問・自問",
    "pattern/内省・口語"
]

# 💬補充说明：
# ✅「～のだろうか」表示“难道～吗？真的～吗？”，
# 　　常用于内心反思、带有不安或怀疑语气。
# 　　本题语气是“这样下去真的好吗？”，符合心境转折。
# ❌「～のではないか」表示“我认为大概是～”，是肯定推测，(不好吗?) 
# 　　语气积极，不能用于表达困惑或反思。
# 💡对比：
#   のではないか → 表推测（I think it probably is）
#   のだろうか → 表自问（Is it really...?）
