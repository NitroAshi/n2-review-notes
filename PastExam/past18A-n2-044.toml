id = "past18A-n2-044"
level = "N2"

[question]
text = "田中「次回の勉強会のテーマは何にしましょうか。」\n山下「私は消費者心理に興味があります。」\n石川「それも面白そうですが、私はアンケートの分析方法を（　）。」"
choices = [
  "取り上げようとするでしょうか",
  "取り上げるようになるでしょうか",
  "取り上げたいのだろうと思います",
  "取り上げてみてはどうかと思います"
]
correct = "取り上げてみてはどうかと思います"

[grammar]
main = "〜てみてはどうか"
related = ["〜てはどうですか", "〜たらどうですか"]

tags = [
  "level/N2",
  "grammar/てみてはどうか",
  "function/提案",
  "pattern/丁寧表現"
]

# ---- 补充说明 ----
# ・「〜てみてはどうか」用于提出建议，是讨论会或会议中最自然的提案表达。
# ・「取り上げようとするでしょうか」表示“会不会试着……呢？”，(对别人)是推测＋疑问，不适合用于提出自己的想法。
# ・「取り上げるようになるでしょうか」表示将来趋势预测，不适合。
# ・「取り上げたいのだろうと思います」是推测他人的愿望，也不适合提案场景。
