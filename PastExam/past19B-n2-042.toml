id = "past19B-n2-042"
level = "N2"

[question]
text = "山田「林さんの手作りクッキー、本当においしかったです。どうもありがとうございました。」\n林「どういたしまして。山田さんにおいしいって（　）です。」"
choices = ["言ってもらえてよかった", "言ってもらってもよかった", "言ってあげられてよかった", "言ってあげてもよかった"]
correct = "言ってもらえてよかった"

[grammar]
main = "〜てもらえてよかった（表示对他人行为的感谢或欣慰）"
related = ["〜てもらう", "〜てよかった", "〜てもらってうれしい"]
tags = [
  "level/N2",
  "grammar/てもらえてよかった",
  "function/感謝・安心",
  "pattern/会話表現"
]

# 🧩 解析：
# 语境：
# 山田称赞林的手作饼干 → 林回应说：“谢谢你这么说，我很高兴听到你觉得好吃。”
# 所以林要表达“能被你这么说真是太好了”，自然的表达是：
# 「おいしいって言ってもらえてよかった」。
#
# ✅ 结构拆解：
# 言ってもらう → “得到别人说（某话）” → 被称赞
# 〜てよかった → “真好 / 太好了（表示高兴、欣慰）”
# 言ってもらえてよかった → “能被你这么说真好 / 谢谢你的夸奖”
#
# 🟥 错误选项分析：
# 2. 言ってもらってもよかった → “即使你说也没关系”。
#   → 「〜てもいい／〜てもよかった」表达许可，而非感谢。
#   意思变成 “就算你说也可以”，完全错了。
#   ✅ 你的直觉里感觉是“时态错”其实不完全对，主要是**语法类型错**。
#
# 3. 言ってあげられてよかった → “我能对你说真好”，主语变成说话人自己，不符。
# 4. 言ってあげてもよかった → “我说给你听也可以”，语义错误。
#
# 💬 英文解释：
# 「〜てもらえてよかった」＝ *I'm glad (that someone did something for me)*  
# → “I’m glad you said it was delicious.”
# 「〜てもらってもよかった」＝ *It would have been okay even if someone had done it* (expresses permission, not gratitude)
#
# ✅ 所以真正的问题不是时态，而是**接续的语气功能不同**：
# - 「〜てもらえて」→ 表达感激与高兴（结果令人高兴）
# - 「〜てもらっても」→ 表达容许或让步（即使…也可以）
