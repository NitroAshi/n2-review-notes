id = "past10A-n2-040"
level = "N2"

[question]
text = "山下「田中君、きみ、また大阪に出張なんだって？」田中「ええ、そうなんですよ。ついこの前も出張に（　）なんですけどね。」"
choices = ["行かれたまま", "行かされたまま", "行かれたばかり", "行かされたばかり"]
correct = "行かされたばかり"

[grammar]
main = "～させられる（使役被动）"
related = ["～たばかり（刚刚～）", "～れる／られる（被动形）"]
tags = [
    "level/N2",
    "grammar/させられる",
    "function/受け身・使役被動",
    "pattern/口語・自然表現"
]

# 💬補充说明：
# ✅「行かされた」是「行く」的使役被动形＝“被迫去／被派去”。
# 　　→ 表示说话人并非主动行为，常含无奈语气。
# ❌「行かれた」是被动形，意为“别人去了”，不能表示“自己被派去”。
# ✅「～たばかり」表示“刚刚做完某事”。
# 　　本题“ついこの前も出張に行かされたばかり”＝“前阵子才刚被派去出差”。
# 💡使役被动形构造原型：
# 　　行く → 行かせる（让去）→ 行かされる（被让去＝被迫去）
