id = "past11A-n2-035"
level = "N2"
mistaskes = 2

[question]
text = "プリンターの調子が悪くなり、製造会社に電話で問い合わせたら、向こうの担当者に、あれこれ質問に答え（　）あげく、対応できないと言われた。"
choices = ["させた", "させられる", "させる", "させられた"]
correct = "させられた"

[grammar]
main = "〜させられる（使役被动形）"
related = ["〜あげく", "〜される（被动）"]
tags = [
    "level/N2",
    "grammar/〜させられる",
    "function/被迫动作",
    "pattern/使役被动・書き言葉"
]

# 注释：
# 「〜させられる」表示“被迫做～”，由他人意志导致的无奈动作。
# 「答える」→「答えさせられる」→过去形「答えさせられた」
# 「〜あげく」接动词た形／名词＋の，表示经过许多麻烦后得出的（多为负面）结果。 (什么什么之后，当然是た形啊，你怎么想的)
# 整句语气中带有“无奈地被对方逼问、最后却徒劳无功”的感情。
