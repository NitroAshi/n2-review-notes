id = "past10B-n2-037"
level = "N2"

[question]
text = "現在、建設作業はスムーズに進んでいるが、必ずしも最初から順調だった（　）。"
choices = ["に限らない", "必要はない", "に違いない", "わけではない"]
correct = "わけではない"

[grammar]
main = "～わけではない（部分否定）"
related = ["必ずしも～わけではない", "だからといって～わけではない"]
tags = [
    "level/N2",
    "grammar/わけではない",
    "function/逆接・部分否定",
    "pattern/書き言葉"
]

# 💬补充说明：
# 「必ずしも～わけではない」表示“未必……”“并不一定……”，常与「が」「けれども」形成转折句。
# 「に違いない」表示“肯定判断”，语气相反，不可与「必ずしも」并用。
# 本句逻辑：现在顺利 ←→ 当初并非如此，因此选「わけではない」。
