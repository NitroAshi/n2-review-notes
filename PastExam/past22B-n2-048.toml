id = "past22B-n2-048"
level = "N2"

[question]
text = "座りすぎがさまざまな体の不満の原因になるという研究報告も（　）。"
choices = ["増えそうでした", "増えてきました", "増えていきました", "増えたところでした"]
correct = "増えてきました"

[grammar]
main = "〜てくる／〜ていく"
related = ["〜ていく", "〜てくる（変化の方向）"]
tags = [
  "level/N2",
  "grammar/〜てくる",
  "function/変化の進行・経過",
  "pattern/動詞て形＋くる"
]

[translation]
sentence = "关于“久坐导致各种身体问题”的研究报告也逐渐增多了。"

# 说明：
# ✅ 「〜てくる」表示“变化从过去到现在逐渐发展”，体现**变化的过程和结果已经到达现在**。
#    因此「増えてきました」＝“（从以前到现在）已经越来越多了”，
#    用于叙述现实趋势，非常自然。
#    → 译为：“有关久坐导致身体问题的研究报告也越来越多了。”
#
# ❌ 「〜ていく」表示变化**将从现在开始往将来发展**，
#    若用「増えていきました」，语气是“之后越来越多”，
#    强调“变化向未来发展”，不适合描述“截至现在已增加”的语境。
#    题中前半句是叙述现代社会现象（已经出现的趋势），所以应选「〜てきました」。
#
# ❌ 「増えそうでした」＝“看起来要增加”，表示推测；
# ❌ 「増えたところでした」＝“刚刚增加”，时间点太短，不合语境。
#
# ✅ 小结：
# 「〜てくる」＝从过去变化至今 → ✅（回顾性的趋势）
# 「〜ていく」＝从现在变化向未来 → ❌（未来导向，不合文意）
