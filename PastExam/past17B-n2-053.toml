id = "past17B-n2-053"
level = "N2"

[question]
text = "鳥の体は空気抵抗を受けにくい形になっています。（　）、鳥は単に翼があるから飛べるのではなく、体全体が飛ぶのに最適な構造になっていることがわかります。"
choices = ["これに対して", "最初に述べたように", "こうして見てみると", "最後の結論から"]
correct = "こうして見てみると"

[grammar]
main = "こうして見てみると：说明文常用连接表达，表示『基于上述事实这样综合来看，就可以明白…』。不是“试试看”。"
related = ["Vてみると（观察结果：一…就会发现）", "Vてみる（尝试做做看，用于口语）"]
tags = [
  "level/N2",
  "grammar/こうして見てみると",
  "function/説明文・論理展開",
  "pattern/結果の発見・観察"
]

# 注释
# 「こうして」＝『像这样、基于上述情况』的承接用法。
# 「Vてみると」＝『通过观察/比较后会发现…』，是说明文常用逻辑结构。
# 整体意思：『这样综合来看，就能理解鸟的身体结构是为了飞行而进化的。』
# 并非“试试看”（口语 Vてみる 的意思不同）。
