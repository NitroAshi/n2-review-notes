id = "past19A-n2-033"
level = "N2"

[question]
text = "X社は、新しい事業を始める（　）、現在、社員を募集している。"
choices = ["とすると", "にあたって", "からには", "のだったら"]
correct = "にあたって"

[grammar]
main = "〜にあたって：在……之际（正式契机）"
related = ["に際して", "からには", "とすると"]

tags = [
  "level/N2",
  "grammar/にあたって",
  "function/契機",
  "pattern/名詞・動詞辞書形+にあたって"
]

# 注释：
# - 「にあたって」用于重大契机，如开会、启动项目、新事业等。
# - 「からには」表示“既然……就必须……”，带有责任/决心语气，不适合本句。
# - 本句是公司正式说明文，因此必须用「にあたって」。
