id = "chokuzen-n2-07-03"
level = "N2"

[question]
text = "心の（　）贈り物をもらうとうれしいものだ。"
choices = ["めぐった", "こもった", "通じた", "通した"]
correct = "こもった"

# 选项注释：
# めぐった：由「巡る」来——循环/巡回/围绕（例：季節が巡る）。不修饰“贈り物”。
# こもった：由「籠もる」来——饱含/包含（情感）（例：心のこもった手紙）。✅本题正确。
# 通じた：由「通じる」来——沟通/理解/相通（例：心が通じた友人）。不自然修饰“贈り物”。
# 通した：由「通す」来——贯穿/让通过/坚持（例：意見を通した）。不搭配“贈り物”。

[grammar]
main = "〜がこもる（籠もる）：‘饱含（感情・心意）’ → 心のこもったN"
related = ["心が通じる（心意相通）", "意見を通す（坚持意见）", "季節が巡る（季节更替）"]
tags = [
  "level/N2",
  "grammar/こもる",
  "function/感情表現",
  "pattern/慣用表現"
]

[explanations]
"めぐった" = "「巡る」→ 循环/巡回/围绕；多用于时间或事件的轮转，不能修饰‘贈り物’。"
"こもった" = "「籠もる」→ 饱含/包含（情感）；固定搭配：心のこもったN。"
"通じた" = "「通じる」→ 相通/理解/传达；常用于人与人之间，不修饰‘贈り物’。"
"通した" = "「通す」→ 贯穿/让通过/贯彻主张；与‘贈り物’语义不符。"
