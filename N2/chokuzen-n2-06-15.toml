id = "chokuzen-n2-06-15"
level = "N2"
mistakes = 2

[question]
text = "教えるということは、教わるということ（　）。"
choices = ["にほかならない", "よりほかない", "になっている", "だけのことはある"]
correct = "にほかならない"

[grammar]
main = "〜にほかならない（正是……／无非就是……）"
related = ["〜に違いない", "〜そのものだ", "〜ということだ"]
tags = [
    "level/N2",
    "grammar/にほかならない",
    "function/断定・本質",
    "pattern/名詞＋にほかならない"
]

[explanation]
correct_usage = "「にほかならない」用于强调‘正是～’或‘无非就是～’的判断。句意：‘教别人，其实正是自己在学习。’"
wrong_choice_2 = "「よりほかない」表示‘只能……’，用于无可奈何的选择，语义不符。"
wrong_choice_3 = "「になっている」表示‘成为……状态’，不表达本质判断。"
wrong_choice_4 = "「だけのことはある」表示‘不愧是……’，用于结果称赞，语义不符。"
