id = "try-n2-08-02"
level = "N2"

[question]
text = "A: 初めて歌舞伎を見たよ。\nB: （　）どうだった？"
choices = ["なお", "そこで", "さて", "それで"]
correct = "それで"

[grammar]
main = "接续助词 'それで' 用于引出结果或后续情节，适用于询问接下来的感受或发生的事情。"
related = ["接续助词", "結果の引き出し"]
tags = [ "level/N2", "grammar/接续助词", "function/因果", "pattern/口語表現" ]

[options]
1 = "なお: 用于补充说明、强调前面的内容，无法引出结果或后续情节。"
2 = "そこで: 表示‘在那个地方’，通常用于描述动作发生的地点，不适合表达感受或后续结果。"
3 = "さて: 用于话题的转移或开始新话题，不适合用在此处询问感受。"
4 = "それで: 表示‘然后、结果是’，常用于引导接下来的内容，适合询问接下来或事情的结果。"

