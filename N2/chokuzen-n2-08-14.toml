id = "try-n2-14-14"
level = "N2"

[question]
text = "本棚にあった１冊の本を手にとって開いた。（　）中に古い写真がはさんであった。"
choices = ["すると", "すなわち", "それで", "それなら"]
correct = "すると"

[grammar]
main = "‘すると’ 用于表示因果关系或前后发生的事件，表示‘于是、然后’。"
related = ["接续助词", "因果", "順接"]
tags = [ "level/N2", "grammar/接续助词", "function/因果", "pattern/口語表現" ]

[options]
1 = "すると: 表示‘于是、然后’，用来描述一个行为后发生的事情，适合用在此处。"
2 = "すなわち: 表示‘也就是说’，用于解释前述内容的含义，无法适应这里的语境。"
3 = "それで: 表示‘因此、所以’，表示因果关系，但在此句中不如‘すると’自然。"
4 = "それなら: 表示‘既然如此、如果是那样’，用于条件句的回应，语境中不合适。"

[original_sentence]
text = "本棚にあった１冊の本を手にとって開いた。（　）中に古い写真がはさんであった。"
translation = "我拿起书架上的一本书打开了。（　）书中夹着一张旧照片。"
