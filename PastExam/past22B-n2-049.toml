id = "past22B-n2-049"
level = "N2"

[question]
text = "座っている姿勢は体にあまり負担がかかっていないと思うかもしれません。（　）、実は立っているときの2倍もの負担が腰にかかるのだそうです。"
choices = ["つまり", "しかも", "ところが", "というのは"]
correct = "ところが"

[grammar]
main = "ところが"
related = ["しかし", "でも"]
tags = [
  "level/N2",
  "grammar/ところが",
  "function/逆接・意外",
  "pattern/接続詞"
]

# [translation]
# sentence = "也许会以为坐着不会给身体带来太大负担，然而实际上，坐着时腰部承受的负担是站立时的两倍。"

# 说明：
# ✅ 「ところが」用于表达“与预想相反的事实”，
#    即“然而、出乎意料地……”。这里前句是“坐着不会太累”，
#    后句却是“坐着反而更负担”，明显是**逆接・意外转折**。
#
# ❌ 「つまり」：表示“换句话说、也就是说”，用于说明或总结，不表达对比。
# ❌ 「しかも」：表示“而且、并且”，用于递进说明，不带转折含义。
# ❌ 「というのは」：表示“之所以……是因为……”，常引出原因解释，不适合这里的语气。
#
# ✅ 整体逻辑：
# 思ったより負担がない →（ところが）→ 実は負担が大きい → 完全符合“出乎预料”的用法。
