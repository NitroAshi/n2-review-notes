id = "past23A-n2-039"
level = "N2"

[question]
text = "睡眠には、体や脳にたまった疲労をとる効果がある。睡眠時間を削ることは、体や脳を回復させる大切な機会を奪うことに（　）のだ。"
choices = ["ほかならない", "欠かせない", "すぎない", "限らない"]
correct = "ほかならない"

[grammar]
main = "〜にほかならない"
related = ["〜にすぎない", "〜に限らない", "〜に欠かせない"]
tags = [
    "level/N2",
    "grammar/にほかならない",
    "function/強調",
    "function/断定",
    "pattern/書き言葉"
]

# 🧩簡易まとめ：
# にほかならない：正是～／无非是～（强断定）→ 成功は努力の結果にほかならない。
# にすぎない：只不过是～而已（弱断定）→ 冗談にすぎない。
# に欠かせない：对～来说不可缺少 → 水は生活に欠かせない。
# に限らない：不限于～ → 若者に限らない。
# 🔑记忆法：「にほかならない」= “就是那个东西本身”，语气最强。
