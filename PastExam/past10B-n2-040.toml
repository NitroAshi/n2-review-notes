id = "past10B-n2-040"
level = "N2"

[question]
text = "相手のためと思ってしたことが、実はその人にとって迷惑になっては（　）。"
choices = ["いないでしょうか", "おかないでしょう", "こないでしょう", "みないでしょうか"]
correct = "いないでしょうか"

[grammar]
main = "～てはいないでしょうか（委婉推量・反省）"
related = ["～のではないでしょうか", "～ている", "～ていない"]
tags = [
    "level/N2",
    "grammar/～てはいないでしょうか",
    "function/推量・反省",
    "pattern/書き言葉・丁寧"
]

# 💬补充说明：
# 「～てはいないでしょうか」是「～ている」的否定推量形式，常用于表达：
# - 自我反省（是不是我们做错了……？）
# - 委婉提醒（是不是那样的情况呢？）
# 本题中的「いない」并非“没有人”，而是「～ている」的否定形。
# 例：私たちは何か誤解してはいないでしょうか（我们是不是哪里误会了？）
