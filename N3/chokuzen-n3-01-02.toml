[question]
text = "どうして悪いところを（　）としないんですか。"
choices = ["直しよう", "直ろう", "直そう", "直られよう"]
correct = "直そう"

[grammar]
main = "意向形＋とする(五段动词)"
related = ["意向形＋と思う", "〜つもりだ"]

tags = [
  "level/N3",
  "grammar/意向形＋とする",
  "function/意志・打算",
  "pattern/動詞活用"
]


# 🌸① 假定：如果…… （普通形＋とすると／とすれば／としたら）
# 明日雨が降るとしたら、行かない。
# （あした あめ が ふる と したら、いかない）
# 如果明天下雨，我就不去。
# 🧠 「〜としたら／とすれば」＝“如果……的话”。

# 🌸② 视为：把……当作……
# 彼をリーダーとするチーム。
# （かれ を りーだー と する ちーむ）
# 以他为队长的团队。
# 🧠 「AをBとする」＝“把A当作B”。

# 🌸③ 决定：定为……
# 今日はこれで終わりとする。
# （きょう は これ で おわり と する）
# 今天就到此为止。
# 🧠 「〜とする」＝“决定／定为～”。

# 🌸④ 意图：想要……
# 出かけようとした。
# （でかけよう と した）
# 打算出门。
# 🧠 「〜ようとする」＝“打算～／试图～”。

# 🌸⑤ 设定・定义：以……为标准
# 参加を原則とする。
# （さんか を げんそく と する）
# 以参加为原则。
# 🧠 「〜を〜とする」＝“以……为……（定义、设定）”。
