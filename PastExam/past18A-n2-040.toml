id = "past18A-n2-040"
level = "N2"

[question]
text = "そのバッグは、どこにでもあるような物なのに、人気歌手が愛用している（　）、１万個も売れたそうだ。"
choices = ["とすること", "というだけ", "とすることを", "というだけで"]
correct = "というだけで"

[grammar]
main = "だけで"
related = ["というだけで", "〜だけ", "〜だけで（理由・原因）"]

tags = [
  "level/N2",
  "grammar/だけで",
  "function/原因・理由（弱い理由→強い結果）",
  "pattern/副助詞"
]

# ---- 补充说明 ----
# ・「だけで」表示“仅凭……就……”，即使理由很弱，仍然导致显著结果。
# ・本题的「というだけで」=「（引用内容）＋だけで」。其中「という」部分用于引用原因，“だけで”承担核心语法功能。
# ・例：有名人がすすめたというだけで売れる → 仅仅因为“听说是名人推荐的”，就卖掉。
# ・本题中“人気歌手が愛用している”是弱理由，“１万個売れた”是强结果，符合「だけで」的典型使用场景。
