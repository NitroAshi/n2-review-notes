id = "past19A-n2-040"
level = "N2"

[question]
text = "押し入れを片付けていたら、子供のころに大切にしていたぬいぐるみが出てきた。（　）と思ったが、どうしても捨てられなかった。"
choices = ["捨ててくるだろう", "捨てているのだ", "捨ててあるのか", "捨ててしまおうか"]
correct = "捨ててしまおうか"

[grammar]
main = "〜てしまおうか：一瞬の『〜してしまおう』という気持ち（自分の思いつき）"
related = [
    "〜てしまう（完成・遗憾）",
    "〜てある（结果存续）",
    "〜ている（状态）"
]

tags = [
  "level/N2",
  "grammar/てしまう",
  "function/心中の思い・一時的な気持ち",
  "pattern/〜てしまおうか"
]

# 注释：
# - 「〜てしまおうか」表示说话人内部产生的“要不要把事情做掉呢？”的念头。
# - 本句搭配「と思ったが、〜できなかった」非常定型：“虽一度想过，但做不到”。
# - 「〜てある」「〜ている」都表示状态，不是“内心的决定或冲动”。
# - 「捨ててくるだろう」是推测别人行为，也不符。
