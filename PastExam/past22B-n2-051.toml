id = "past22B-n2-051"
level = "N2"

[question]
text = "職場で座っている時間が長い人は、（　）。"
choices = ["試してみてもいいですか", "試してみたらいいのでしょうか", "試してみればよかったですか", "試してみてはいかがでしょうか"]
correct = "試してみてはいかがでしょうか"

[grammar]
main = "〜てはいかがでしょうか"
related = ["〜たらいいのでしょうか", "〜たらどうですか", "〜てはどうですか"]
tags = [
  "level/N2",
  "grammar/〜てはいかがでしょうか",
  "function/勧誘・提案（礼貌）",
  "pattern/動詞て形＋はいかがでしょうか"
]

# [translation]
# sentence = "对于在职场上久坐的人，不妨试试看。"

# 说明：
# ✅ 「〜てはいかがでしょうか」＝「〜てはどうですか」的礼貌表达，
#    用于向听者提出建议或推荐行动，语气正式而客气。
#    例：「少し休んではいかがでしょうか。」（不妨休息一下。）
#
# 🔹 和「〜たらいいのでしょうか」的区别：
#    ・「〜てはいかがでしょうか」→ 说话者**提出建议**（主动）
#    ・「〜たらいいのでしょうか」→ 说话者**征求意见**（询问）
#    前者常用于说明文、商务文或广告；后者用于提问或求助语境。
#
# ✅ 本题语境是说明文结尾的**建议性语气**，
#    因此「試してみてはいかがでしょうか」最自然。
# ❌ 「〜たらいいのでしょうか」语气太弱，像“我是不是该试试看呢？”不符合说明文风格。
