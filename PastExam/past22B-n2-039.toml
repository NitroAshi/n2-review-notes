id = "past22B-n2-039"
level = "N2"
mistakes = 2

[question]
text = "「倉庫の中を片付けなければ」と前からずっと思っているのだが、忙しくてなかなか（　）。"
choices = ["できずにいる", "できるだろうか", "できないこともない", "できるのではないか"]
correct = "できずにいる"

[grammar]
main = "〜ずにいる"
related = ["〜ないでいる", "〜ないままでいる"]
tags = [
  "level/N2",
  "grammar/〜ずにいる",
  "function/状態の継続",
  "pattern/動詞ない形＋ずにいる"
]

# 说明：
# ✅ 「〜ずにいる」＝「〜ないでいる」，表示“没有做某事的状态持续着”。
#    「忙しくてなかなかできずにいる」＝“因为太忙一直没能做”。
#    句意：一直想着要整理仓库，但因为忙碌，一直没能动手。
#
# ❌ 「できるのではないか」表示“是不是可以做呢”的推量、判断语气，
#    不符合“因为太忙所以一直没做”的语境。前句“なかなか”暗示“难以实现”，
#    因此只能接表示“未能做到”的表达。
#
# ❌ 「できないこともない」表示“不是不能做”，反而暗示“还是能做的”，
#    与“なかなか”矛盾。
#
# ❌ 「できるだろうか」表示“能不能做呢”，常用于自问或疑问语气，
#    但此句是陈述“没能做”的现状。
#
# ✅ 补充：
# 「〜ずに」是书面语，「〜ないで」是口语。此句语气较正式，故用「ずに」更自然。
# 例句：宿題をせずに寝てしまった。（没做作业就睡了）
