# 解説：
# 「において」= '在/于'，用于地点、时间、领域、场合（多为书面语）。抽象名词也可接：教育・研究・現代社会・国際社会など。
# 句意：在多样信息充斥的现代社会中，重要的是从海量信息里筛选出对自己必要的信息的能力。
# 误选排除：
# 1 に加えて：'在…之外还…'，语义是添加，不是设定背景。
# 3 を基にして：'以…为基础/依据'，本句后项不是“以现代表社会为依据去做某事”的结构。
# 4 を込めて：'饱含（情感等）'，与信息选择无关。
# 注意同音异义：
# 「において」（助词型）≠「置いて」（动词“置く”的て形/「〜ておく」）。前者表示“在…中”，后者表示“放置/事先做”。
# 常见搭配：Aにおいては…；AにおけるB；1990年代において；国際関係において。
