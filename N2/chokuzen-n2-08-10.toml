id = "try-n2-08-10"
level = "N2"

[question]
text = "私、ここに来られるのは今日が最後なんです。（　）転職するんです。"
choices = ["もっとも", "というのは", "そこで", "それでも"]
correct = "というのは"

[grammar]
main = "‘というのは’ 用于引出对前文的解释或说明，表示‘也就是说、就是说’。"
related = ["接续助词", "解释", "说明"]
tags = [ "level/N2", "grammar/接续助词", "function/解释", "pattern/口語表現" ]

[options]
1 = "もっとも: 表示‘当然、最为’，通常引入最重要或最合适的内容，不适合用在此处。"
2 = "というのは: 表示‘也就是说、就是说’，用于解释前文内容，适合在本句中解释为什么是最后一次来。"
3 = "そこで: 表示‘在那个情况下’，通常用于因果关系，但不适合用在此处。"
4 = "それでも: 表示‘尽管如此’，常用于转折，语境中不适用。"

[original_sentence]
text = "私、ここに来られるのは今日が最後なんです。（　）転職するんです。"
translation = "我今天是最后一次来这里。（　）我要换工作了。"
