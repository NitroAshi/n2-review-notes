[question]
text = "この辺りは、春はお花見、夏は川遊び、秋は紅葉、冬はスキー（　）、１年中自然を楽しむことができます。"
choices = ["のことかと", "かのように", "ということと", "というように"]
correct = "というように"

[grammar]
main = "〜というように（举例说明・总结）"
related = ["〜ように", "〜など", "〜とか"]
tags = [
  "level/N2",
  "grammar/〜というように",
  "function/举例・说明",
  "pattern/书面表达"
]

# 注释:
# 【句意】“这一带啊，春天赏花、夏天玩水、秋天赏红叶、冬天滑雪，
# 像这样一年四季都能享受大自然。”
#
# 【语法说明】
# 「〜というように」用于将前面的具体例子总结为一般性说明，
# 相当于“像……那样”“例如……”。常见于说明文、介绍文。
# 例: 「春は花見、夏は花火大会、秋は紅葉、冬は雪祭りというように、
# 季節ごとに楽しみがあります。」→“像这样，日本四季都有乐趣。”
#
# 【各选项解释】
# 1. のことかと：常用于「〜のことかと思った」结构，表示推测或误解。
#    例：「あなたの声のことかと思った。」→“我以为是你的声音。”
#    → 本题语法位置不对，不可用。
#
# 2. かのように：表示比喻、好像～一样。
#    例：「彼は何も知らない**かのように**話した。」→“他装作什么都不知道一样。”
#    → 本题不是比喻，而是列举总结，语义不符。
#
# 3. ということと：用于并列两个事项或事实。
#    例：「行くということと、帰るということ。」→“去和回这两件事。”
#    → 本题不是并列，而是例举总结，不合适。
#
# 4. というように（正确答案）：表示举例说明或总结。
#    例：「春は花見、夏は川遊びというように、季節ごとに楽しめます。」
#    →“像这样，每个季节都有乐趣。”
