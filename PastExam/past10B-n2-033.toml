id = "past10B-n2-033"
level = "N2"

[question]
text = "休日は混雑が予想されますので、お電話でご予約の（　）、ご来店ください。"
choices = ["あげく", "あまり", "うえ", "ほう"]
correct = "うえ"

[grammar]
main = "～上（で）"
related = ["～たあとで", "～に基づいて"]
tags = [
    "level/N2",
    "grammar/～上で",
    "function/順接・手順",
    "pattern/書き言葉"
]

# 💬補充说明：
# 「～上（で）」有两个主要用法：
# 1️⃣ 手顺・时间顺序：「～したあとで」—— ご予約の上、ご来店ください。
# 2️⃣ 基礎・判断依据：「～に基づいて」—— データの上で判断する。
# 「上（で）」多用于正式场合、公告、通知等书面语中。
# 此题中的「上」可省略「で」，但语气仍然正式。
