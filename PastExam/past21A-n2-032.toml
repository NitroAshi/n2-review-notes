id = "past21A-n2-032"
level = "N2"

[question]
text = "最近（　）パソコンの調子がおかしい。この状態が続くようだったら一度修理に出したほうがよさそうだ。"
choices = ["ちっとも", "いったい", "どうも", "まさか"]
correct = "どうも"

[grammar]
main = "どうも（＝なんとなく〜ようだ）"
related = ["どうやら", "らしい", "ようだ"]
tags = [
    "level/N2",
    "grammar/どうも",
    "function/推量・様子",
    "pattern/会話・口語"
]

# 各选项含义：
# 1. ちっとも：一点也（不）……（后接否定）
# 2. いったい：到底……（用于疑问句加强语气）
# 3. どうも：总觉得……／似乎……（表示模糊推测或轻微不确定）
# 4. まさか：难道……／没想到……（用于意外、惊讶）

# 最近どうも調子が悪い。
# → 最近总觉得状态不好。

# どうも思い出せない。
# → 怎么也想不起来。

# どうもありがとうございます。
# どうもすみません。
# どうも。（口语简略）