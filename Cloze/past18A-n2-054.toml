id = "past18A-n2-054"
level = "N2"

[question]
text = "道路の違いは見た目にはよくわからないかもしれない。しかし、人々がより安全で快適に暮らせるよう、足元で（　）。"
choices = ["支えてくれているはずだった", "支えてくれているわけだ", "支えてくれているからだった", "支えてくれているおかげだ"]
correct = "支えてくれているわけだ"

[grammar]
main = "わけだ（説明・結論）"
related = ["〜というわけだ", "〜わけではない", "〜おかげだ（原因・感謝）"]

tags = [
  "level/N2",
  "grammar/わけだ",
  "function/説明・結論",
  "pattern/文末説明"
]

# ---- 补充说明 ----
# ・「〜わけだ」用于通过前文逻辑得出总结、解释、结论性判断，非常适合本句“为了A→所以B”的结构。
# ・前文的「〜よう」表目的，与説明的「わけだ」联用最自然。
# ・「〜おかげだ」表示“多亏……（积极结果）”，需要明显的“原因→结果”关系。本题不在表达感谢语气，因此不适合。
# ・其他选项语法或语义均与“説明・結論”语气不符。
