id = "chokuzen-n2-07-04"
level = "N2"

[question]
text = "彼女は耳も（　）目も見えなかった。"
choices = ["聞こえないと", "聞こえなくて", "聞こえなければ", "聞こえても"]
correct = "聞こえなければ"

[grammar]
main = "〜なければ〜ない（既不……也不……）"
related = ["〜も〜も〜ない", "〜なくて", "〜ないと", "〜ても"]
tags = [
  "level/N2",
  "grammar/〜なければ〜ない",
  "function/並列・否定",
  "pattern/書き言葉"
]

[notes]
"聞こえないと" = "表示条件：如果听不见就……（例：聞こえないと困る）。不适合表达并列否定。"
"聞こえなくて" = "表示原因或并列：因为听不见～（例：聞こえなくて困った）。逻辑上变成‘因为听不见所以看不见’，不通。"
"聞こえなければ" = "表示并列否定：既不……也不……（例：耳も聞こえなければ目も見えない）。✅ 正确用法。"
"聞こえても" = "表示逆接：即使听得见也～（例：聞こえても無視する）。与句意不符。"
