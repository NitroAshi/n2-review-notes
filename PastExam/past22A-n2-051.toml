[question]
text = "駐輪場不足を解決し、より快適で安全な街に（　）、全自動式の地下駐輪場の設置は有効な手段の一つだといえる。"
choices = ["しても", "するために", "なったように", "なってはじめて"]
correct = "するために"

[grammar]
main = "～ために"
related = ["～ように", "～なったように", "～ための"]
