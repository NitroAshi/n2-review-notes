id = "chokuzen-n3-02-12"
level = "N3"
mistakes = 3

[question]
text = "注意書き（　）、この薬を飲むと眠くなるらしい。"
choices = ["によって", "によれば", "による", "について"]
correct = "によれば"

[grammar]
main = "名詞＋によれば：表示传闻或信息的出处，‘根据…’"
related = ["による", "によって", "について"]

tags = [
  "level/N3",
  "grammar/によれば",
  "function/伝聞・根拠",
  "pattern/書き言葉"
]

# 🌸 ① によって（原因・手段・方式）
# 努力によって成功した。
# （どりょく に よって せいこう した）
# 通过努力取得了成功。
# 🧠 → “由于／通过”，讲原因或手段。
# 🌸 ② によれば（信息来源・传闻）
# 天気予報によれば、明日は雨だそうです。
# （てんきよほう に よれば、あした は あめ だ そう です）
# 据天气预报说明，明天好像要下雨。
# 🧠 → “根据……（得知）”，讲信息来源。
# 🌸 ③ によると（信息来源・口语）
# ニュースによると、地震があったそうだ。
# （ニュース に よると、じしん が あった そう だ）
# 听新闻说，发生地震了。
# 🧠 → 同「によれば」，但语气更口语化一点。
# 🌸 ④ により（正式书面语）
# 手続きはメールにより行われます。
# （てつづき は めーる に より おこなわれます）
# 手续将通过邮件进行。
# 🧠 → 「によって」的书面语，常出现在通知、公文、说明书中。