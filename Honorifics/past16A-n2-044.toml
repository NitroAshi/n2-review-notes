id = "past16A-n2-044"
level = "N2"

[question]
text = "客「すみません、この携帯電話を解約したいんですが。」店員「かしこまりました。差し支えなければ、解約の理由を（　）。」"
choices = ["お聞きしませんか", "お聞きになりますか", "お聞きしてもよろしいでしょうか", "お聞きになったらいかがですか"]
correct = "お聞きしてもよろしいでしょうか"

[grammar]
main = "お〜してもよろしいでしょうか（自谦＋许可请求）"
related = ["〜てもいいですか（可以……吗）", "〜せていただけますか（能让我……吗）"]
tags = [
    "level/N2",
    "grammar/お〜してもよろしいでしょうか",
    "function/謙譲表現・丁寧な依頼",
    "pattern/お＋動詞連用形＋してもよろしいでしょうか"
]

# 备注：
# 「お聞きしてもよろしいでしょうか」= “我可以请问一下吗？”
# 用于服务、接待场合中，讲话者（下位者）对对方（上位者、客户）请求许可。
# 「お聞きしませんか」则是“要不要我来问”，语义错误。
# 例句：お名前を伺ってもよろしいでしょうか。（请问我可以询问您的姓名吗？）
