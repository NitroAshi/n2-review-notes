id = "past10A-n2-054"
level = "N2"
mistaskes = 3 

[question]
text = "こう考えると、やはり、血液型によって性格がたった４種類に分けられるとは（　）。"
choices = [
    "言われてこなかったのです",
    "言われていないのでしょう",
    "言えないことはないのです",
    "言えないのではないでしょうか"
]
correct = "言えないのではないでしょうか"

[grammar]
main = "～のではないでしょうか（委婉推测・婉转意见）"
related = ["～のではないか（轻推测）", "～でしょう（一般推测）"]
tags = [
    "level/N2",
    "grammar/のではないでしょうか",
    "function/推量・婉曲断定",
    "pattern/書き言葉・柔らかい意見"
]

# 💬補充说明：
# ✅「～のではないでしょうか」表示“恐怕～吧”“是不是～呢”，
# 　　用于委婉地表达说话人的意见或推测，语气柔和、带不确定感。
# 　　本句作者是在委婉否定“性格可由血型分类”的观点。
# 　　→ 整句意为：“说性格可以按血型分成四种，这种说法恐怕不太成立吧。”
#
# ───────────────────────────────
# 🔹 各选项含义与语气对比：
#
# 1. 言われてこなかったのです
# 　　＝“以前没人这么说过。”（说明过去事实）
# 　　→ 语义：陈述“没人提过这种说法”，不是“不能说”，与文意不符。
#
# 2. 言われていないのでしょう
# 　　＝“大概没人这么说吧。”（轻推测）
# 　　→ 语义：主语变为“别人”，偏离主题；作者不是在讨论“是否被人说过”，
# 　　   而是在表达自己的看法。
#
# 3. 言えないことはないのです
# 　　＝“也不是不能这么说。”（双重否定→肯定语气）
# 　　→ 意思是“也可以这么说”，与题意“不能说这样”相反。
#
# ✅4. 言えないのではないでしょうか
# 　　＝“恐怕不能这么说吧。”（委婉推测）
# 　　→ 完全符合说明文常用语气：既表达否定，又保持礼貌与客观。
#
# 💡结构原型：普通形＋のではないでしょうか → 表委婉意见/推测
# 　　例：彼の意見は正しいのではないでしょうか（他的意见恐怕是对的吧）。
