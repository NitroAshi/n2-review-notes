[question]
text = "娘は、社会人（　）朝一人で起きられない。私が起こさないといつまでも寝ている。"
choices = ["にもなって", "にもなれば", "にでもなって", "にでもなれば"]
correct = "にもなって"

[grammar]
main = "名詞＋にもなって"
related = ["名詞＋になって", "名詞＋にもなれば"]
tags = [
  "level/N2",
  "grammar/にもなって",
  "function/批判・驚き",
  "pattern/名詞＋にも＋なって接続"
]

# --- 各选项解析 ---

# ✅ にもなって
# 意味：都已经成为……却（还那样）
# 接续：名詞＋にもなって
# 语气：批评・惊讶・不满
# 例文：
#   ・大人にもなってそんなことを言うの？→ 都已经是大人了还说这种话？
#   ・社会人にもなって朝起きられない。→ 都已经是社会人了还起不来。

# ❌ にもなれば
# 意味：如果成为……的话（假设条件）
# 接续：名詞＋にもなれば
# 例文：
#   ・社会人にもなれば責任が重くなる。→ 成为社会人后责任就重了。
# 说明：表示假设或一般论，非批评语气。

# ❌ にでもなって
# 意味：哪怕随便成个～也（假设或建议）
# 接续：名詞＋にでもなって
# 例文：
#   ・先生にでもなってみたら？→ 要不去当老师试试？
# 说明：表示提议或轻微假设。

# ❌ にでもなれば
# 意味：如果哪天成了～（假设）
# 例文：
#   ・親にでもなれば分かるよ。→ 等你当了父母就懂了。
# 说明：表示未来假设，不符本题事实语境。
