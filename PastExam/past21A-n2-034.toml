id = "past21A-n2-034"
level = "N2"

[question]
text = "めったに出かけないのに、外出するとき（　）大雨になる。"
choices = ["にあたって", "にかぎって", "において", "に際して"]
correct = "にかぎって"

[grammar]
main = "にかぎって"
related = ["に限り", "に限らず", "にあたって"]
tags = [
    "level/N2",
    "grammar/にかぎって",
    "function/例外・偶然",
    "pattern/口語・主観"
]

# 各选项含义：
# 1. にあたって：在……之际；用于正式、隆重场合（如入学・開会・結婚）
# 2. にかぎって：偏偏在……时／唯独……；表示偶然、抱怨或例外 ✅
# 3. において：在……（地点・时间・场合）；书面语
# 4. に際して：当……之际；与「にあたって」相似，用于正式场合
