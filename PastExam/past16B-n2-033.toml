id = "past16B-n2-033"
level = "N2"

[question]
text = "卒業論文がなかなか書けなくて、一時は（　）かけたが、何とか今日無事に提出することができた。"
choices = ["あきらめ", "あきらめて", "あきらめる", "あきらめた"]
correct = "あきらめ"

[grammar]
main = "〜かける"
related = ["〜かけだ", "〜かけの", "〜かける（動詞連用形＋かける）"]
tags = [
  "level/N2",
  "grammar/〜かける",
  "function/中途・未完成",
  "pattern/動詞連用形＋かける"
]

# 解説:
# 「〜かける」表示“刚要〜”“差点〜”“〜到一半还没完成”的意思，接在动词的連用形（ます形去ます）后面。
# 例：食べかける（吃到一半）、死にかける（差点死掉）
# 本句中「あきらめ」是「あきらめる」的連用形(二类动词)因此「あきらめかけた」正确。
# 全句意为：“论文一直写不出来，一度差点放弃，但总算今天顺利提交了。”
# ✳️如果选「あきらめて」，则变成了“真的放弃了”的意思，与后句“無事に提出できた”矛盾。
# ✳️“かけた”前只能接連用形，不接終止形「あきらめる」或過去形「あきらめた」。
