id = "past22A-n2-032"
level = "N2"

[question]
text = "A：「新しい携帯電話、ちょっと使いづらいんだよね。」 B：「使っていれば（　）慣れるよ。」"
choices = ["いまにも", "ようやく", "そのうち", "いつのまに"]
correct = "そのうち"

[grammar]
main = "そのうち"
related = ["いまにも", "ようやく", "いつのまにか"]
tags = [
  "level/N2",
  "grammar/そのうち",
  "function/時間表現",
  "pattern/副詞"
]

# 🟩 各选项详解
# 1. いまにも（今にも）
#    意思：马上就要……（常与「～そうだ」搭配，表示某事即将发生）
#    例句：いまにも雨が降りそうだ。→ 马上就要下雨了。

# 2. ようやく（漸く）
#    意思：终于（经过长时间、努力或困难后才达成）
#    例句：ようやく仕事が終わった。→ 工作终于结束了。

# 3. そのうち（其の内）
#    意思：过一阵子、迟早、将来某个时候（不确定但自然会发生）
#    例句：使っていればそのうち慣れるよ。→ 用着用着迟早会习惯的。

# 4. いつのまに（いつの間に）
#    意思：不知不觉间（常与过去形动词搭配）
#    例句：いつのまにか寝てしまった。→ 不知不觉就睡着了。
