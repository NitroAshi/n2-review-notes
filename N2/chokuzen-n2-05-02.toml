id = "chokuzen-n2-05-02"
level = "N2"

[question]
text = "私は背が高い（　）、どこにいても目立ってしまう。"
choices = ["わりに", "かわりに", "ばかりに", "どころか"]
correct = "ばかりに"

[grammar]
main = "〜ばかりに（表示因小原因引发遗憾结果）"
related = ["〜わりに", "〜どころか", "〜かわりに"]
tags = [
    "level/N2",
    "grammar/ばかりに",
    "function/原因・结果",
    "pattern/普通形＋ばかりに（ナ形容词＋な／名词＋である＋ばかりに）"
]

# 📘 〜ばかりに
# 含义：正因为……才导致（不好的）结果
# 用法：表达“因为某个小原因，而导致不理想的结果”
# 接续：普通形＋ばかりに（ナ形容词＋な／名词＋である＋ばかりに）
# 例句：彼を信じたばかりに、ひどい目にあった。
#       （正因为相信了他，结果遭了大罪。）
# 本题中：背が高いばかりに → 因为个子高（这一原因），无论在哪都很显眼。

# 🚫 〜わりに
# 含义：虽然……但……
# 用法：表示前后不成比例或反差
# 接续：名词＋の／ナ形容词＋な／普通形＋わりに
# 例句：年のわりに若く見える。（虽然年龄大，但看起来年轻。）
# 本题不是反差句，而是因果句，故不能用わりに。
