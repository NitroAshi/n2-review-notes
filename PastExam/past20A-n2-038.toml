id = "past20A-n2-038"
level = "N2"

[question]
text = "今日は、本当は映画を（　）が、雪が降ってきたので、やめた。"
choices = ["見に行ってばかりだ", "見に行ったばかりだ", "見に行くつもりだった", "見に行ったつもりだった"]
correct = "見に行くつもりだった"

[grammar]
main = "〜つもりだ（表示意志・计划）"
related = ["〜予定だ", "〜つもりはない", "〜ことにする"]
connection = "動詞辞書形／動詞ない形＋つもりだ"
tags = [
  "level/N2",
  "grammar/つもりだ",
  "function/意志・予定",
  "pattern/日常表現"
]

# 解析：
# 核心语法「〜つもりだ」表示“打算…… / 打算要……”，即说话人的意志或计划。
#
# ✅ 正确用法：
# 「〜つもりだった」是过去式，表示“原本打算……但最终没做”。
# 句意：今天本来打算去看电影，但因为下雪就作罢了。
#
# 🧠 接续：
# 動詞辞書形＋つもりだ　→ 行くつもりだ（打算去）
# 動詞ない形＋つもりだ　→ 行かないつもりだ（打算不去）
#
# 🟥 错误选项：
# 4. 見に行ったつもりだった → “自以为去看了”，表示误解或认知错误，不符语境。
# 1. 見に行ってばかりだ → “总是在看电影”，习惯性动作，不符。
# 2. 見に行ったばかりだ → “刚去看过”，语义不符。
#
# 💬 英文解释：
# 「〜つもりだった」＝ *was planning / intended to ... (but didn’t)*
# 「〜たつもりだった」＝ *thought I had done ... (but actually hadn’t)*
#
# 🔹对比记忆：
# | 语法 | 含义 | 例句 |
# |------|------|------|
# | 〜つもりだ | 打算做 | 明日勉強するつもりだ。 |
# | 〜つもりだった | 原本打算做但没做 | 行くつもりだったが、行けなかった。 |
# | 〜たつもりだった | 自以为做了但其实没做 | 電話したつもりだったが、忘れた。 |
