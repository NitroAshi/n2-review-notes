id = "past20A-n2-042"
level = "N2"

[question]
text = "木村「田中君、アルバイトを探してるんだって？」\n田中「うん、そうなんだ。」\n木村「わたしが働いている店がアルバイトを募集しているから応募してみない？ もちろん田中さんが（　）。」"
choices = ["いいなんて", "よかったっけ", "いいからだよね", "よければだけど"]
correct = "よければだけど"

[grammar]
main = "よければだけど：用于提出建议时的委婉表达，表示‘如果你觉得可以的话，不过……’。带有弱化语气、不强迫对方的意思。"
related = ["〜ければ", "〜けど（语气软化）", "〜てもいいなら"]
tags = [
  "level/N2",
  "grammar/よければだけど",
  "function/委婉建议",
  "pattern/会话表达"
]

# 注释：
# ・よければ = よい（好）的假定形：如果可以的话
# ・だけど = “不过”“但是” → 弱化语气，让建议更柔和
# ・常用于向对方“推荐、邀请”但不想造成压力的场合
