id = "past18B-n2-032"
level = "N2"

[question]
text = "さっき、買い物（　）、コンビニに寄ってATMでお金を下ろしてきた。"
choices = ["の場合", "にしては", "のついでに", "というのは"]
correct = "のついでに"

[grammar]
main = "〜のついでに：做A的顺便做B"
related = ["ついでに", "名詞 + のついでに", "動詞辞書形 + ついでに"]

tags = [
  "level/N2",
  "grammar/ついでに",
  "function/顺便",
  "pattern/連用修飾"
]

# 注释：
# - 「AのついでにB」表示做A的同时，顺便完成B。本题的动作关系是最自然的顺便结构。
# - 「場合」用于情况说明，「にしては」用于意外评价，「というのは」用于解释定义，都不符合句中逻辑结构。
