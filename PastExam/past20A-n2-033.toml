id = "past20A-n2-033"
level = "N2"

[question]
text = "腰の曲がった老人に似ている（　）、エビが「海老」とも書かれると聞いた。"
choices = ["ものを", "とともに", "うえで", "ところから"]
correct = "ところから"

[grammar]
main = "〜ところから（表示由某事引申出的原因或根据）"
related = ["〜ことから", "〜ために"]
tags = [
  "level/N2",
  "grammar/ところから",
  "function/原因・由来",
  "pattern/説明・推定"
]

# 🧩 解析：
# 「〜ところから」表示“由于……的情况，所以……”，常用于说明“由来、命名理由、推断根据”等。
# 句意：因为虾看起来像腰弯的老人，所以写作“海老”（老的意思）。
# 即“正因为这个原因，‘虾’才会被写作‘海老’”。

# ✅ 正确用法：
# 腰の曲がった老人に似ているところから、「海老」と書かれる。
# → “因为像腰弯的老人，所以写作‘海老’。”

# 🟥 错误选项：
# 1. ものを：表示逆接（“虽然……却……”），语义不符。
# 2. とともに：表示“随着…… / 与……一起”，语义不符。
# 3. うえで：表示“在……之后 / 以……为基础”，不是说明由来或原因。

# 💬 英文解释：
# 「〜ところから」＝ *from the fact that / because (of the situation that)...*  
# → “The shrimp is written as ‘sea old man’ because it looks like an old man with a bent back.”


## 🧠 补充区分：「うえに」「うえは」「うえで」
# 这些都来自「上（うえ）」但语法意义不同👇

# | 表达 | 含义 | 接续 | 例句 | 英文释义 |
# |------|------|------|------|------------|
# | うえに | 不仅…而且…（递进） | 普通形＋うえに | 彼は頭がいい**うえに**性格もいい。| not only... but also |
# | うえは | 既然…就…（决定・条件） | 動辞書形＋うえは | 約束した**うえは**守らなければならない。| now that / since |
# | うえで | 在…之后 / 以…为基础 | 動た形＋うえで（之后）／動辞書形＋うえで（目的） | よく考えた**うえで**決めます。| after / upon / for the purpose of |
# | ところから | 由于（根据某事的特征） | 普通形＋ところから | 顔が赤い**ところから**、彼が犯人だと思われた。| because / from the fact that |

# ---

# 💡记忆小技巧：
# - **うえに** → “再加上”  
# - **うえは** → “既然这样，就…”  
# - **うえで** → “在…之后 / 为了…”  
# - **ところから** → “根据这个现象 / 因此才…”  
