id = "past16B-n2-041"
level = "N2"
mistaskes = 2

[question]
text = "（説明書で）エアコンを掃除するときは、安全上、必ずコンセントを（　）してください。"
choices = ["抜いたことを", "抜いたことが", "抜いてからに", "抜いてからは"]
correct = "抜いてからに"

[grammar]
main = "〜てからにする"
related = ["〜てから", "〜にする"]
tags = [
  "level/N2",
  "grammar/〜てからにする",
  "function/顺序・决定・正式指示",
  "pattern/複合文法・書き言葉"
]

# 解説：
# 「〜てからにする」是由「〜てから」＋「にする」组成的复合语法。
# 「〜てから」表示“在……之后”，强调动作顺序；
# 「にする」表示“决定…… / 设定为……”。 
# 合起来「〜てからにする」表示“决定在……之后再进行某动作”，
# 常用于说明书、指示文、公告等正式场合，语气比「〜てから〜する」更郑重。

# ✅ 句意：
# 「必ずコンセントを抜いてからにしてください。」
# → “请务必在拔下插头之后再进行（清扫）。”
# 说明书语气中，这种表达比「抜いてからしてください」更自然、更规范。

# ❌ 误选：
# 1. 抜いたことを：表示“拔过这件事”，无意义。
# 2. 抜いたことが：表示“拔过的经历”，不合语境。
# 4. 抜いてからは：表示“自从拔掉之后……”，只能接持续状态，不能用于命令或请求。

# 💡 记忆要点：
# 「〜てからにする」＝“设定为在……之后再进行”，
# 在正式文体中可视作礼貌版「〜てから〜してください」。
# 例：
# ・作業は電源を切ってからにしてください。
# ・運転はお酒を飲んでからにはしないでください。
