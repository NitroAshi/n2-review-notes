id = "past23A-n2-040"
level = "N2"

[question]
text = "木村「山下さん、先ほど、さくら銀行の南さんからお電話がありまして、今日中に連絡してほしい（　）。」山下「はい、わかりました。」"
choices = ["ことになりました", "とのことでした", "と助かるのですが", "ようにしてください"]
correct = "とのことでした"

[grammar]
main = "〜とのことでした"
related = ["〜ということです", "〜そうです"]
tags = [
    "level/N2",
    "grammar/とのことでした",
    "function/伝聞",
    "function/丁寧表現",
    "pattern/ビジネス会話"
]

# 🧩簡易まとめ：
# とのことでした：听说～／～说过（礼貌转述）→ 社長から電話があったとのことでした。
# ことになりました：决定～（结果）→ 来週出張することになりました。
# と助かるのですが：如果～就太好了（请求）→ 手伝ってくれると助かるのですが。
# ようにしてください：请～（命令语气）→ 注意するようにしてください。
# 🔑记忆法：「とのことでした」＝别人说的话的礼貌转达（商务会话常用）。
