id = "chokuzen-n2-06-10"
level = "N2"

[question]
text = "よそから来た人（　）、ここの習慣は受け入れがたいものなのかもしれない。"
choices = ["からには", "からして", "からみると", "からでないと"]
correct = "からみると"

[grammar]
main = "〜からみると（从……来看／从……角度判断）"
related = ["〜からすると", "〜からいえば", "〜からいうと"]
tags = [
    "level/N2",
    "grammar/からみると",
    "function/立場・観点",
    "pattern/名詞＋からみると"
]

[explanation]
correct_usage = "「からみると」表示从某人、某立场来看。句意：‘对从别处来的人来说，这里的习惯可能难以接受。’"
wrong_choice_2 = "「からして」表示‘从……来看（根据部分特征推测）’，用于事物特征判断，不用于表示人的立场或观点，因此不自然。"
wrong_choice_1 = "「からには」表示‘既然……就……’，语义不符。"
wrong_choice_4 = "「からでないと」表示‘如果不……就……不了’，语法结构与句意不符。"

[example]
sentence = "このスープは色からして辛そうだ。"
translation = "这汤光从颜色上看就觉得很辣。"
note = "「からして」用于根据某个特征或迹象判断整体印象，是本题易混点。"
