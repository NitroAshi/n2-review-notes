id = "past17B-n2-044"
level = "N2"

[question]
text = "高校野球全国大会を前に、X高校野球部の南豊選手は「監督やコーチが私たち一人一人に毎日熱心に指導を（　）。監督やコーチのためにも、優勝したいです。」と決意を述べた。"
choices = ["いらっしゃいました", "してくださりました", "まいりました", "していただきました"]
correct = "してくださりました"

[grammar]
main = "してくださる：尊敬語。目上・相手方が自分（たち）に対して何かしてくれる際に使う。動作主への敬意を表す。"
related = ["〜ていただく（自谦语）", "いらっしゃる（尊敬语：行く・来る・いる）", "まいる（自谦语：行く・来る）"]
tags = [
  "level/N2",
  "grammar/尊敬語",
  "function/敬語・尊敬語",
  "pattern/接客・公式スピーチ"
]

# 选项释义补充
# 1. いらっしゃいました：行く・来る・いる的尊敬语，不能接「指導を〜」。
# 2. してくださりました：する的尊敬语（てくださる），表示“对方为我做……”，本题正确。
# 3. まいりました：行く・来る的自谦语，不能修饰「指導をする」。
# 4. していただきました：自谦语“从对方那里得到了…”，不用于叙述对方的动作主体。
