id = "chokuzen-n2-06-11"
level = "N2"

[question]
text = "この小説の主人公のモデルは、あの人（　）。"
choices = ["っぽい", "にすぎない", "かのようだ", "に相違ない"]
correct = "に相違ない"

[grammar]
main = "〜に相違ない（一定是……／毋庸置疑是……）"
related = ["〜に違いない", "〜に決まっている", "〜に間違いない"]
tags = [
    "level/N2",
    "grammar/に相違ない",
    "function/断定・推量",
    "pattern/書き言葉・正式表現"
]

[explanation]
correct_usage = "「に相違ない」表示强烈推定或确信，相当于‘一定是～’。句意：‘这部小说主人公的原型一定就是那个人。’"
wrong_choice_3 = "「かのようだ」表示‘好像……一样’，用于比喻或假象，与‘确信’语气相反。"
wrong_choice_1 = "「っぽい」口语化，表示‘像……’，语体不符。"
wrong_choice_2 = "「にすぎない」表示‘不过是……而已’，意义相反。"
