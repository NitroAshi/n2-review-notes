id = "past19B-n2-041"
level = "N2"
mistakes = 2

[question]
text = "上田「課長、すみません、今日お休みをいただけないでしょうか。娘と夫が風邪で熱を出してしまったんです。」\n課長「それは大変だね。わかりました。看病で疲れて、上田さんが（　）。」"
choices = ["倒れなくなるよ", "倒れてしまいたくないのに", "倒れないことになるの", "倒れてしまわないようにね"]
correct = "倒れてしまわないようにね"

[grammar]
main = "〜ないように（表示希望避免某种情况）"
related = ["〜ようにする", "〜ないようにする", "〜ように気をつける"]
tags = [
  "level/N2",
  "grammar/ないように",
  "function/劝告・注意",
  "pattern/会話表現"
]

# 🧩 解析：
# 语境是课长在电话中安慰并关心部下：
# 「看病で疲れて、上田さんが倒れてしまわないようにね。」
# 意思是：“别因为照顾他们太累了，自己也累倒了啊。”
# → 表达“希望不要发生某事”，语气温和、自然。
#
# ✅「〜ないように」表示“为了不～”、“希望不要～”，
# 其中的「〜てしまう」表示“（不小心）～了”，
# 合起来「倒れてしまわないように」= “不要累倒了”。
#
# 🟥 你选的「倒れなくなるよ」的问题：
# 「〜なくなる」表示“不能～了 / 不再～”，
# 意思是“会变得倒不下去了”，语义完全错误。
# 举例：
# - 食べられなくなる → 吃不下了。
# - 眠れなくなる → 睡不着了。
# 所以「倒れなくなるよ」= “不会倒下了哟” → 不符合语境（关心语气反而奇怪）。
#
# 其他选项：
# 2. 倒れてしまいたくないのに → “明明不想倒下却…” 语法通但语义不符。
# 3. 倒れないことになるの → “结果就不会倒下了？” 语气不自然。
# 4. 倒れてしまわないようにね ✅ 表达关心、自然、符合电话语境。
#
# 💬 英文解释：
# 「〜ないように」＝ *so that (something bad) doesn’t happen / take care not to ...*
# → “Take care so you don’t collapse from exhaustion.”
# 「倒れなくなる」＝ *to become unable to fall down* → grammatically correct but semantically nonsense here.

# | 他动词（使别人或东西倒下）        | 自动词（自己倒下）             |
# | -------------------- | --------------------- |
# | 倒す（たおす）to knock down | 倒れる（たおれる）to fall down |
