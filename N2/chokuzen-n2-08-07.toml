id = "try-n2-08-07"
level = "N2"

[question]
text = "A: 手紙、出してくれた？\nB: （　）、忘れてしまって、まだ鞄の中に持ってるの。"
choices = ["そういえば", "それが", "それはそうと", "そこで"]
correct = "それが"

[grammar]
main = "‘それが’ 用于表示转折或解释，适合在前文基础上引出与之对立或相关的解释。"
related = ["接续助词", "转折", "解释"]
tags = [ "level/N2", "grammar/接续助词", "function/转折", "pattern/口語表現" ]

[options]
1 = "そういえば: 表示‘说起来、想起来’，用于突然回忆起某事物，但不适合解释前面的情境。"
2 = "それが: 表示转折或解释，用来承接前文并引出相反或补充的内容，适用于本句中解释没有寄信的原因。"
3 = "それはそうと: 表示‘话说回来’，通常用于转移话题，不适用于此句的情境。"
4 = "そこで: 表示‘在那时、于是’，通常用于描述某个行为或事件发生的时间点，不适合表达解释关系。"

[original_sentence]
text = "A: 手紙、出してくれた？\nB: （　）、忘れてしまって、まだ鞄の中に持ってるの。"
translation = "信寄出去了吗？\n我忘记了，信还在包里。"
