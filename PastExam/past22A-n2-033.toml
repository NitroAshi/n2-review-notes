id = "past22A-n2-033"
level = "N2"

[question]
text = "今朝は寝坊してしまい、食事をする時間（　）顔を洗う時間もなかった。"
choices = ["すら", "しか", "とはいえ", "どころか"]
correct = "どころか"

[grammar]
main = "～どころか"
related = ["～すら", "～どころではない", "～も"]
tags = [
  "level/N2",
  "grammar/どころか",
  "function/逆接・程度",
  "pattern/文中対比"
]

# 🟩 各选项详解
# 1. すら：
#    意思：连……都……（举出极端例子）
#    例句：疲れていて食事すらできなかった。→ 累得连饭都没吃。
#    ❌ 本题不合适，因为句子有“更进一步的对比（顔を洗う）”，需用「どころか」。

# 2. しか：
#    意思：只……（与否定搭配）
#    例句：100円しか持っていない。→ 只有100日元。
#    ❌ 本句不是“限定数量”，语法不符。

# 3. とはいえ：
#    意思：虽然那样说，但是……
#    例句：雨とはいえ、試合は行われた。→ 虽然下雨了，但比赛照常进行。
#    ❌ 不表达“程度差”或“更严重”的含义。

# 4. どころか：
#    意思：别说……连……都……；哪儿谈得上……（表示实际情况比前项更严重）
#    例句：旅行どころか、休みも取れない。→ 别说旅行了，连休假都不行。
#    ✅ 正确答案。
