id = "past19B-n2-037"
level = "N2"

[question]
text = "夫は動物が好きじゃないから、もし私がペットを飼いたいと言っても、（　）。"
choices = ["反対しかねる", "反対しようがない", "反対するならいい", "反対するに決まっている"]
correct = "反対するに決まっている"

[grammar]
main = "〜に決まっている（表示强烈的推测、理所当然）"
related = ["〜に違いない", "〜はずだ"]
tags = [
  "level/N2",
  "grammar/に決まっている",
  "function/推量",
  "pattern/口语表达"
]

# 解析：
# 「〜に決まっている」表示“肯定……”、“一定……”，带有说话人强烈确信的语气。
# 句意：因为丈夫不喜欢动物，就算我说想养宠物，他肯定会反对。
#
# 其他选项：
# 1. 反対しかねる：表示“可能会反对”或“很可能会……”，语气偏委婉，不如「に決まっている」强烈。
# 2. 反対しようがない：表示“无从反对、没有反对的理由”，与语境相反（丈夫不喜欢动物当然会反对，不是“没法反对”）。
# 3. 反対するならいい：意思是“要是反对也行”，语气不自然，不合逻辑。
# 因此正确答案是 4.「反対するに決まっている」。
