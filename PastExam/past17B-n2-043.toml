id = "past17B-n2-043"
level = "N2"

[question]
text = "妻「ねえ、このスープ、レシピ通りに作ったんだけど、どう？味、薄くない？もう少し塩を（　）。」夫「ううん、ちょうどいいよ。」"
choices = ["入れたことはよかったね", "入れたからよかったなあ", "入れたほうがよかったかな", "入れたところがよかったよね"]
correct = "入れたほうがよかったかな"

[grammar]
main = "かな：表示说话人的轻微推测、疑问、自言自语的确认。语气柔和，用于委婉征询意见或表达不确定。"
related = ["ね（表示共感、确认既成事实）", "〜ほうがよかった（委婉建议或假设性评价）"]
tags = [
  "level/N2",
  "grammar/かな",
  "function/推測・委婉疑問",
  "pattern/会話・婉曲"
]

# 选项释义补充
# 1. 入れたことはよかったね：用于确认“加了是好的”；语境不符（盐还没加）。
# 2. 入れたからよかったなあ：表示因为加了所以很好；亦是既成事实表达。
# 3. 入れたほうがよかったかな：委婉推测“是否加了会更好呢？”，符合妻子的语气与情境（正确答案）。
# 4. 入れたところがよかったよね：「ところが」表示逆接，语法功能错误，不适合本句。
