id = "chokuzen-n2-06-12"
level = "N2"
mistakes = 2

[question]
text = "アジア（　）日本の役割を考えなければならない。"
choices = ["をめぐる", "にかけて", "における", "に対する"]
correct = "における"

[grammar]
main = "〜における（在……中的／关于……的）"
related = ["〜において", "〜での", "〜の中で"]
tags = [
    "level/N2",
    "grammar/における",
    "function/場所・領域・状況",
    "pattern/名詞＋における＋名詞"
]

[explanation]
correct_usage = "「における」是「において」的连体形，表示‘在……中的’。句意：‘必须思考日本在亚洲中的角色。’"
wrong_choice_1 = "「をめぐる」表示‘围绕……’的争论或话题，语义不符。"
wrong_choice_2 = "「にかけて」表示时间或空间范围，或在某方面突出，不适用于此。"
wrong_choice_4 = "「に対する」表示‘对……’，用于动作、感情或态度的对象，语法不符。"
