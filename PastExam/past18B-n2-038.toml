id = "past18B-n2-038"
level = "N2"

[question]
text = "レストランハヤマのランチは、AランチかBランチの２種類（　）選べないが、安くてとてもおいしい。"
choices = ["にしか", "にだけ", "からしか", "からだけ"]
correct = "からしか"

[grammar]
main = "名詞＋からしか〜ない：只能从……（限制感强）"
related = ["しか〜ない", "だけ", "名詞＋から"]

tags = [
  "level/N2",
  "grammar/しか〜ない",
  "function/限定",
  "pattern/名詞接続"
]

# 注释：
# - 「からしか〜ない」表示来源受限，本句“从两种里只能选”。
# - 「にしか」表示对象或范围，不适合“来源选择”。
# - 「だけ」是中性限定，不如「しか〜ない」带有限制语感。
# - 本句语境中“虽然只能选两种”需要负面限制感，因此选「からしか」。
