id = "try-n2-08-12"
level = "N2"
mistakes = 2

[question]
text = "A: 昨日は大変でしたね。\nB: ええ、ほんとうに疲れました。（　）、高橋選手、メダルとりましたね！"
choices = ["要するに", "ということは", "それなのに", "それはそうと"]
correct = "それはそうと"

[grammar]
main = "‘それはそうと’ 用于话题转移，表示‘话说回来、顺便提一下’，引入一个与前文相关但不直接的内容。"
related = ["接续助词", "话题转移", "口語表現"]
tags = [ "level/N2", "grammar/接续助词", "function/话题转移", "pattern/口語表現" ]

[options]
1 = "要するに: 表示‘简而言之、总而言之’，用于总结内容，适用于解释，而不适合话题转移。"
2 = "ということは: 表示‘也就是说、就是说’，用于解释说明前文内容，不适用于话题转移。"
3 = "それなのに: 表示‘尽管如此、然而’，通常用于转折，表示前后内容之间有对立或矛盾。"
4 = "それはそうと: 表示‘话说回来、顺便提一下’，用于转移话题，适合用于B引入新话题‘高桥选手拿到奖牌’。"

[original_sentence]
text = "A: 昨日は大変でしたね。\nB: ええ、ほんとうに疲れました。（　）、高橋選手、メダルとりましたね！"
translation = "昨天很辛苦吧？\n是的，真的很累。（　）高桥选手拿到奖牌了！"
