id = "past20A-n2-035"
level = "N2"

[question]
text = "このテニスコートの利用料金は2時間1000円で、1時間しか使わない（　）、1000円払わなければなりません。"
choices = ["場合でも", "点でも", "場合には", "点には"]
correct = "場合でも"

[grammar]
main = "場合でも：表示让步（即使……也……）。前项与后项呈逆接关系。"
related = ["場合には（如果……的话）", "〜ても", "〜といっても"]
tags = [
  "level/N2",
  "grammar/場合でも",
  "function/逆接・让步",
  "pattern/条件・让步区分"
]

# 注释（重点记忆）：
# ・場合には：条件（如果〜的话），表示在某条件成立时采取的措施。结果会因条件不同而改变。
# ・場合でも：让步（即使〜也〜），表示条件变化但结果不变。
# ・本题表达“规则不变”，符合逆接用法，因此选「場合でも」。
