# 解説：
# ✅「〜んだって？」是口语中用来确认传闻或询问事实的表达，相当于「〜のだそうだ（そうなの？）」。
# 意为“听说你〜啊？”、“你是不是〜呢？”
#
# 句子「中村くん、毎日ジョギングしてるんだって？」＝
# “中村君，听说你每天都在慢跑啊？”（语气柔和、带确认意味）
#
# 对方回答「うん、そうなんだよ。」→“嗯，是啊。” 完全自然。
# 
# 若选「しない？」则成“你不跑步吗？”，语义上变成**否定疑问**，与后续对话不连贯。
# 因为中村回答“そうなんだよ”表示**肯定事实**，只能接“你每天跑步啊？”这种确认问句。

