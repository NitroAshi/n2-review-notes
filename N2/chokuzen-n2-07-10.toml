id = "chokuzen-n2-07-09"
level = "N2"

[question]
text = "人は無いものを欲しがる（　）。"
choices = ["ことか", "ものだ", "ことはない", "ものがある"]
correct = "ものだ"

[grammar]
main = "〜ものだ（表示普遍规律或常识）"
related = ["〜ことか", "〜ことはない", "〜ものがある"]
tags = [
  "level/N2",
  "grammar/ものだ",
  "function/表规律・常识",
  "pattern/口語・書き言葉"
]

[notes]
"ことか" = "表示感叹或强调，通常用于表达惊讶或强调某事（例：こんなに簡単なことか！）。本句并非感叹句，错误。"
"ものだ" = "表示普遍规律或常识，描述自然现象或惯常的事情（例：人は無いものを欲しがるものだ）。✅"
"ことはない" = "表示‘不需要做某事’或‘不必’（例：そんなことはない）。本句不是否定句，错误。"
"ものがある" = "表示存在某种情感或现象，强调某种感觉（例：彼の言い方には不満を感じるものがある）。不适合用于此处，错误。"
