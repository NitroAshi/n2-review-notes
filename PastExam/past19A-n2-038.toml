id = "past19A-n2-038"
level = "N2"

[question]
text = "鈴木選手は、アマチュア時代に何度かこの大会に出場しているが、プロの選手（　）今回が初めての出場だ。"
choices = ["としては", "としても", "にとっては", "にとっても"]
correct = "としては"

[grammar]
main = "〜として（は）：作为……（身份・立場）"
related = ["〜にとって（は）：对于……来说（主観評価）"]

tags = [
  "level/N2",
  "grammar/としては",
  "function/立場・身份",
  "pattern/名詞＋として（は）"
]

# 注释：
# - 「としては」表示某身份下的判断，如「プロとしては」「学生としては」。
# - 「にとっては」表示主观评价，不适用于身份区分。
# - 本句要表达“作为职业选手，这是首次出场”，因此必须用「としては」。
