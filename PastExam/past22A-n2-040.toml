id = "past22A-n2-040"
level = "N2"

[question]
text = "飼っている犬が最近よくしゃっくりをする。心配になって病院で聞いてみたら、1時間以上続く場合は検査したほうがいいが、すぐに止まるなら（　）と言われた。"
choices = ["心配しなければならない", "心配しないでもない", "心配するわけではない", "心配することはない"]
correct = "心配することはない"

[grammar]
main = "～ことはない"
related = ["～ないでもない", "～わけではない"]
tags = [
  "level/N2",
  "grammar/ことはない",
  "function/助言・不要",
  "pattern/安慰表現"
]

# 🟩 各选项详解
# 1. 心配しなければならない：
#    意思：必须担心 → 表示义务，不符合医生安慰语气。
#    例句：もっと注意しなければならない。→ 必须更加注意。

# 2. 心配しないでもない：
#    意思：也不是不担心 → 表示“多少有点担心”。
#    例句：行きたくないでもない。→ 也不是完全不想去。
#    ❌ 本句医生是在安慰病人，不是表示模糊担心。

# 3. 心配するわけではない：
#    意思：并不是担心 → 用于辩解语气。
#    例句：嫌いなわけではない。→ 并不是讨厌。
#    ❌ 不适合用于劝安心。

# 4. 心配することはない：
#    意思：没必要担心／不必担心。
#    例句：そんなに心配することはないよ。→ 没必要那么担心。
#    ✅ 正确答案。
