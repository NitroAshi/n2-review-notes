id = "past11A-n2-043"
level = "N2"

[question]
text = "A「 あれ？あそこにいるの、山田さんかな。」 B「 山田さんは出張中だよ。今ここに（　）。」"
choices = ["いないわけじゃないよ", "いるわけないじゃない", "いたわけじゃないよ", "いなかったわけじゃない"]
correct = "いるわけないじゃない"

[grammar]
main = "〜わけがない（〜わけない）"
related = ["〜わけではない", "〜わけにはいかない"]
tags = [
    "level/N2",
    "grammar/〜わけがない",
    "function/强烈否定・不可能",
    "pattern/口語表現・強調"
]

# 注释：
# 「〜わけがない／〜わけない」＝“不可能～”“没道理～”。
# 「〜じゃない」在此不是“提议语气”，而是“强烈否定语气”。 (不是吗)
# 整句语气：驳斥对方的误解，“他现在在出差，当然不可能在这！”
# 对比：
#   「〜わけではない」→ 部分否定（并非～）
#   「〜わけがない」→ 强烈否定（绝不可能～）
#   「〜わけにはいかない」→ 表示“不能做～（因道义、常识等原因）”
