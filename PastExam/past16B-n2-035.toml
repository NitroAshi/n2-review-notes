id = "past16B-n2-035"
level = "N2"

[question]
text = "多様な情報があふれる現代社会（　）、大切なのは、膨大な情報の中から、自分に必要な情報を選ぶ力である。"
choices = ["に加えて", "において", "を基にして", "を込めて"]
correct = "において"

[grammar]
main = "名詞＋において（は）／における＋名詞"
related = ["では（口語的对应）", "名詞＋に際して／にあたって（～的时候，场合）"]
tags = [
  "level/N2",
