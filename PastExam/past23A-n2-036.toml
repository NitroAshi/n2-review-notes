id = "past23A-n2-036"
level = "N2"

[question]
text = "「リマインド」とは、「再確認」の意味を持ち、「会議の日程が近づいたので、出席者にリマインドした。」（　）使用されるビジネス用語である。"
choices = ["というように", "というような", "ということのように", "ということのような"]
correct = "というように"

[grammar]
main = "〜というように"
related = ["〜というような", "〜ということのように", "〜ということのような"]
tags = [
    "level/N2",
    "grammar/というように",
    "function/例示",
    "pattern/引用表現"
]

# 🧩簡易まとめ：
# というように：像～那样地（举例用）→ 「ありがとう」というように使われる。
# というような：那样的～（修饰名词）→ 彼というような人。
# ということのように：好像～一样地（推测，书面）→ 自然表达少。
# ということのような：好像～那样的～（多余，不自然）。
# 🔑记忆法：「ように」修饰动词，「ような」修饰名词。
