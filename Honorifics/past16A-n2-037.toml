id = "past16A-n2-037"
level = "N2"

[question]
text = "課長「山下さん、A社の木村様が（　）、応接室に案内してください。」"
choices = ["参ったら", "伺ったら", "おありだったら", "おいでになったら"]
correct = "おいでになったら"

[grammar]
main = "おいでになる（尊敬語：行く・来る・いる）"
related = ["いらっしゃる（尊敬語）", "参る（謙譲語）", "伺う（謙譲語）"]
tags = [
  "level/N2",
  "grammar/おいでになる",
  "function/尊敬語",
  "pattern/行く・来る・いるの尊敬語"
]

# 选项逐项说明：
# 1) 参ったら：参る＝行く/来る 的謙譲語。用于“己方/自己”降低身份：私が参りました。
#    不能拿来描述“客人（对方）来”。因此本题×。
# 2) 伺ったら：伺う＝行く/来る/聞く 的謙譲語。亦只用于己方：明日、部長の所へ伺います。
#    描述“木村様が来る”时绝不能用謙譲語。×
# 3) おありだったら：「おありになる」是「ある」的尊敬语，用于“物・用事がある/お時間がおありですか”等存在/所有。
#    不用于“人が来る”这种移动/到来意义。语义不合。×
# 4) おいでになったら：おいでになる＝行く/来る/いる 的尊敬语（≈いらっしゃる）。
#    “木村様が（来たら）”→对客户用尊敬语，语境贴合。◎（正解）
#
# 补充：
# ・同义替换：いらっしゃったら 也可；但本题给的是 おいでになったら。
# ・敬语选用原则：对“对方/上位者”→尊敬语；对“己方/自己”→謙譲語。
