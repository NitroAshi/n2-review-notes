id = "past17B-n2-035"
level = "N2"

[question]
text = "司会「森さん、第五回X文学賞受賞おめでとうございます。今のお気持ちはいかがですか。」森「ありがとうございます。（　）受賞できるとは思わなかったので、すごく嬉しいです。」"
choices = ["たとえ", "まさか", "せめて", "かりに"]
correct = "まさか"

[grammar]
main = "まさか：表示强烈的意外、难以置信；常与「〜とは思わなかった」「〜まい」搭配，表示“没想到竟然……”"
related = ["まさか〜ないだろう", "まさかの〜", "かりに（假设）", "たとえ（让步）"]
tags = [
  "level/N2",
  "grammar/まさか",
  "function/惊讶・意外",
  "pattern/副词"
]

# 选项释义补充
# 1. たとえ：即便、纵使（让步）→ 常见结构「たとえ〜ても」。
# 2. まさか：万万没想到、居然（表示惊讶/意外），与本句「〜とは思わなかった」完美搭配。
# 3. せめて：至少、起码（表达最低限度的愿望）。
# 4. かりに：假如、万一（假设，用于虚拟条件）。
