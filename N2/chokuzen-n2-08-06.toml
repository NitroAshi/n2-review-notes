id = "try-n2-08-06"
level = "N2"

[question]
text = "人気者のプロゴルファーにはギャラリー（　）観客がぞろぞろついて回っている。"
choices = ["すなわち", "あるいは", "おまけに", "ちなみに"]
correct = "すなわち"

[grammar]
main = "‘すなわち’ 用于对前文的内容进行解释或说明，通常用于进一步阐述事物的本质或性质。"
related = ["接续助词", "解释", "因果"]
tags = [ "level/N2", "grammar/接续助词", "function/解释", "pattern/口語表現" ]

[options]
1 = "すなわち: 用于解释说明前文内容的本质或性质，适合在此句中进一步解释观众跟随的原因。"
2 = "あるいは: 表示‘或者’，通常用于列举或选择，不能用于解释或补充说明。"
3 = "おまけに: 表示‘此外、而且’，语气带有附加或轻微的增加，适用于轻松的补充，而不适用于此句的正式解释。"
4 = "ちなみに: 用于‘顺便提一下’，用于提供与前文相关的附带信息，通常不用于补充说明或因果关系。"
