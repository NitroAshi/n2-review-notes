id = "past10A-n2-035"
level = "N2"

[question]
text = "踏切事故のために、２時間（　）、電車がストップしました。"
choices = ["につき", "につれ", "にわたり", "にともない"]
correct = "にわたり"

[grammar]
main = "～にわたり（在……期间/范围内）"
related = ["～につれ（随着……）", "～にともない（伴随……）", "～につき（由于……）"]
tags = [
    "level/N2",
    "grammar/にわたり",
    "function/時間・範囲",
    "pattern/書き言葉"
]

# 💬補充说明：
# ✅「にわたり」：表示“在……期间 / 范围内持续”，用于时间或空间范围。
# 　　例：三日間にわたり雨が降った（下了整整三天的雨）。
# 　　本题“电车停了两小时”强调持续状态，因此选「にわたり」。
#
# ❌「につれ」：表示“随着……变化”，用于前项变化引起后项变化。
# 　　例：年を取るにつれて体力が落ちる（随着年龄增长体力下降）。
# 　　本题不是“变化关系”，而是“持续时间”，不合适。
#
# ❌「にともない」：表示“伴随……一起发生”，比「につれ」更书面。
# 　　例：人口の増加にともない、住宅が不足している。
#
# ⚠️「につき」：表示“由于……（原因）”，多用于公告、正式文书。
# 　　例：工事中につき、立ち入り禁止（因施工中，禁止入内）。
# 　　本题前面已有「ために」（也是原因表达），语义重复，不自然。
