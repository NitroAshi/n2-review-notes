id = "past17A-n2-052"
level = "N2"
mistakes = 2

[question]
text = "マスターズに参加する高齢者が増えれば、この理想に近づくことができる。（　）、マスターズの存在が影響を与えるのは、参加者にとどまらない。"
choices = ["とすると", "とはいえ", "さらに", "このように"]
correct = "さらに"

[grammar]
main = "さらに（递进・补充说明）"
related = ["そのうえ", "しかも", "そして"]
tags = [
  "level/N2",
  "grammar/さらに",
  "function/递进・补充",
  "pattern/书面表达"
]

# 注释:
# 【句意】“如果参加者增加，就能接近理想。而且，它的影响不仅限于参加者本人。”
#
# 【选项含义】
# 1. とすると：假设、推论（“如果这样的话”）→ 不合逻辑。
# 2. とはいえ：让步、转折（“虽说如此”）→ 不合语气。
# 3. さらに：递进、补充（“而且/进一步”）→ 正确。
# 4. このように：举例总结（“像这样”）→ 不适合此处展开句。
