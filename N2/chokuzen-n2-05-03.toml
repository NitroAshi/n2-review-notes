id = "chokuzen-n2-05-03"
level = "N2"

[question]
text = "ご予算（　）お食事が楽しめます。"
choices = ["に対して", "に際して", "に比べて", "に応じて"]
correct = "に応じて"

[grammar]
main = "〜に応じて（根据……，对应……）"
related = ["〜に対して", "〜に際して", "〜に比べて"]
tags = [
    "level/N2",
    "grammar/に応じて",
    "function/対応・変化",
    "pattern/名詞＋に応じて"
]

# 📘 〜に応じて
# 含义：根据前项的状况或条件，后项作出相应变化。
# 接续：名詞＋に応じて
# 例句：能力に応じて給料が決められる。
#       （根据能力决定薪水。）
# 本题中「ご予算に応じて」＝“根据预算”。
# 因此表达“可以根据预算享用餐食”，语义自然。

# 🚫 〜に対して
# 含义：对……采取态度／施加动作
# 用法：表示行为方向或态度对象
# 例句：先生に対して失礼なことを言うな。
# 本题不是“对谁做什么”，而是“根据……变化”，
# 所以不能用に対して。
