id = "past21A-n2-041"
level = "N2"

[question]
text = "就職が決まった会社に「早く働きたい」と話したら、その後連絡が来て、就職するまでの間、アルバイトを（　）。"
choices = ["してあげることになった", "してもらうことにした", "させてあげることにした", "させてもらうことになった"]
correct = "させてもらうことになった"

[grammar]
main = "〜させてもらう（被许可・謙譲表現）"
related = ["〜させていただく", "〜させてあげる", "〜てもらう"]
tags = [
    "level/N2",
    "grammar/させてもらう",
    "function/許可・謙譲",
    "pattern/ビジネス会話"
]

# 各选项含义：
# 1. してあげることになった：我帮别人做（错误；不可能“为公司施恩”）
# 2. してもらうことにした：我让别人帮我做（错误；不是别人帮我打工）
# 3. させてあげることにした：我让别人做（错误；说话人不是许可者）
# 4. させてもらうことになった：承蒙允许，由我来做（谦逊表达）✅

# 🌸使役・授受体系总结：
# 「〜てあげる」＝ 我为别人做（施恩）
# 「〜てもらう」＝ 我得到别人帮助（受惠）
# 「〜てくれる」＝ 别人为我做（受惠，强调感情）
# 「〜させてもらう」＝ 承蒙许可，我被允许去做（谦逊）✅
# 「〜させてあげる」＝ 我允许别人去做（许可别人）
#
# ✅快速判断法：
# - “别人允许我做” → 「させてもらう」
# - “我允许别人做” → 「させてあげる」
# - “我帮别人做” → 「てあげる」
# - “别人帮我做” → 「てもらう／てくれる」
