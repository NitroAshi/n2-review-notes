id = "past19A-n2-036"
level = "N2"

[question]
text = "日曜日に行われたマラソン大会に弟が参加して、10キロのコースを45分で（　）。"
choices = ["走りきった", "走り始めた", "走ってばかりだ", "走るようにする"]
correct = "走りきった"

[grammar]
main = "〜きる：动作彻底完成，做到最后"
related = ["走りきる", "読みきる", "やりきる", "〜ようにする（努力・习惯）"]

tags = [
  "level/N2",
  "grammar/〜きる",
  "function/动作完遂",
  "pattern/動詞連用形＋きる"
]

# 注释：
# - 「走りきる」表示“跑完全程”，最符合马拉松语境。
# - 「〜ようにする」表示努力形成习惯，不能表示完成某个比赛或动作。
# - 「走り始めた」「走ってばかりだ」都不涉及“完成”意义，不能用。
