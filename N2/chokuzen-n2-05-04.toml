id = "chokuzen-n2-05-04"
level = "N2"

[question]
text = "なぜあんなことをしたのか、本人に聞いてみない（　）理由はわからない。"
choices = ["ことには", "ことから", "ことだから", "ものなら"]
correct = "ことには"

[grammar]
main = "〜ないことには（如果不……就……不了）"
related = ["〜ことから", "〜ことだから", "〜ものなら"]
tags = [
    "level/N2",
    "grammar/ないことには",
    "function/条件・否定",
    "pattern/Vない形＋ことには"
]

# 🔸「〜しないことには、どうにもならない。」
# “不做就什么都没法改变。”

# 📘 〜ないことには
# 含义：如果不……就……不了
# 用法：表示不进行前项动作，后项无法实现（常接否定句）
# 接续：V（ない形）＋ことには
# 例句：実際に見てみないことには、よくわからない。
# 本题中「本人に聞いてみないことには理由はわからない」
# 意思是“不问本人就不知道理由”，符合典型用法。

# 🚫 〜ことから
# 表示“因为……由此得知／由此命名”
# 🚫 〜ことだから
# 表示“正因为是某人……所以……”
# 🚫 〜ものなら
# 表示“如果能……（多为愿望性假设）”
