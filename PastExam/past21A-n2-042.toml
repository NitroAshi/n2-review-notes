id = "past21A-n2-042"
level = "N2"

[question]
text = "A「先輩に食事に誘われちゃって。どうしよう。行きたくないなあ。」 B「どうして悩むの？ 嫌なら（　）？」 A「そうなんだけど、先輩だし、断りにくくない？」"
choices = ["断ればいいだけなの", "断りたいだけなの", "断ればいいだけでしょう", "断りたいだけでしょう"]
correct = "断ればいいだけでしょう"

[grammar]
main = "〜ばいいだけ（でしょう／なの）"
related = ["〜だけでいい", "〜ばいい", "〜たらいい"]
tags = [
    "level/N2",
    "grammar/〜ばいいだけ",
    "function/助言・主張",
    "pattern/口語表現"
]

# 各选项含义：
# 1. 断ればいいだけなの：只要拒绝就行而已嘛（语气平淡、自言自语）❌
# 2. 断りたいだけなの：只是想拒绝而已（逻辑不符）❌
# 3. 断ればいいだけでしょう：不想去就拒绝嘛（理所当然、劝说语气）✅
# 4. 断りたいだけでしょう：只是想拒绝吧（带揣测语气，语义不符）❌

# 💡语气对比速记：
# 「〜だけなの」＝ 自己解释、语气柔和（多用于独白）
# 「〜だけでしょう」＝ 劝说／反问语气（多用于对话中指出“理所当然”）
# ✅ 快速判断法：
#   - 对别人说 → 用「〜でしょう」
#   - 对自己感叹 → 用「〜なの」
