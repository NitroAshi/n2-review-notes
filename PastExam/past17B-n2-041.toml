id = "past17B-n2-041"
level = "N2"

[question]
text = "先生「皆さん、海や川に落ちてしまったときは、無理に（　）、仰向けになって、浮かんで助けを待つことが大切です。」"
choices = ["泳げなくなると", "泳ごうとしないので", "泳げなくなって", "泳ごうとしないで"]
correct = "泳ごうとしないで"

[grammar]
main = "V意向形＋とする：试图…，打算…；表示主体意图做某动作的企图。本题使用其否定命令形「V意向形＋としないで」表示“不要试图…”"
related = ["Vようとしない（完全不尝试…）", "Vようとした（试图做但未成功）"]
tags = [
  "level/N2",
  "grammar/意向形+とする",
  "function/意図・企图",
  "pattern/否定命令"
]

# 选项释义补充
# 1. 泳げなくなると：如果变得不能游，则…（条件）→ 不符合语境。
# 2. 泳ごうとしないので：因为不试图游泳（因果）→ 不自然。
# 3. 泳げなくなって：变得不能游后→ 不符合语境。
# 4. 泳ごうとしないで：不要尝试去游（禁止语气），语境完全正确。
