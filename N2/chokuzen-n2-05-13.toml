id = "chokuzen-n2-05-13"
level = "N2"

[question]
text = "できない約束をしても、（　）。"
choices = ["守れがたい", "守れっこない", "守るわけだ", "守りかねない"]
correct = "守れっこない"

[grammar]
main = "〜っこない（根本不可能……）"
related = ["〜わけだ", "〜かねない"]
tags = [
    "level/N2",
    "grammar/っこない",
    "function/否定・不可能",
    "pattern/Vます形＋っこない"
]

# 📘 〜っこない
# 含义：根本不可能……／绝对不会……。用于强烈否定可能性，语气口语化。
# 接续：動詞ます形去ます＋っこない
# 例句：そんなこと、子どもにできっこない。（那种事小孩根本做不到。）
# 本题中「守れっこない」＝“根本不可能守得住”。

# 🚫 〜わけだ
# 含义：理所当然／难怪……，表示解释说明。
# 例句：寒いわけだ。雪が降っているから。（难怪冷，原来下雪了。）
# 本题不是解释语气，而是否定可能性，故不适用。
