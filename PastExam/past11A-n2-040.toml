id = "past11A-n2-040"
level = "N2"

[question]
text = "毎日（　）どちらでもいいことばかりを日記に書いているのだが、それがストレス解消になっている。"
choices = ["書くとも書かないとも", "書いたか書かなかったか", "書いても書かなくても", "書くとか書かないとか"]
correct = "書いても書かなくても"

[grammar]
main = "〜ても〜なくても"
related = ["〜ても", "〜なくても", "〜か〜ないか"]
tags = [
    "level/N2",
    "grammar/〜ても〜なくても",
    "function/无论条件",
    "pattern/口語表現・対比構文"
]

# 注释：
# 「〜ても〜なくても」表示“无论是否～”，不是逆接，而是条件并列。
# 结构：動詞て形＋も＋動詞否定形＋ても
# 例：行っても行かなくてもいい（去不去都行）
# 常与「どちらでもいい」「同じ」「関係ない」等呼应。
# 句中“どちらでもいい”是关键提示，指向“无论写或不写”的语义。
