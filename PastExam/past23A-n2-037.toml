id = "past23A-n2-037"
level = "N2"

[question]
text = "学校や病院では定期的に避難訓練が行われている。避難訓練を（　）、火災などがあったときに落ち着いて行動できるからだ。"
choices = ["しておくには", "しているとしても", "しておくことで", "しているかというと"]
correct = "しておくことで"

[grammar]
main = "〜しておくことで"
related = ["〜することで", "〜しておくには", "〜ておく"]
tags = [
    "level/N2",
    "grammar/しておくことで",
    "function/原因",
    "function/手段",
    "pattern/動作結果"
]

# 🧩簡易まとめ：
# しておくことで：通过预先做～而～（原因／手段）→ 練習しておくことで自信がつく。
# しておくには：为了～要～（目的／条件）→ 合格するには努力が必要だ。
# しているとしても：即使～也～（逆接）→ 準備しているとしても不安だ。
# しているかというと：说到是否～（话题提示）→ 勉強しているかというとそうでもない。
# 🔑记忆法：「ことで」＝结果／手段，「には」＝目的。
