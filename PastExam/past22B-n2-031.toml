id = "past22B-n2-031"
level = "N2"

[question]
text = "先週末は、（　）かけだった3冊の本をすべて最後まで読んだ。"
choices = ["読む", "読み", "読んで", "読んだ"]
correct = "読み"

[grammar]
main = "〜かけだ"
related = ["〜かけの", "〜かける"]
tags = [
  "level/N2",
  "grammar/〜かけだ",
  "function/状態・途中",
  "pattern/連用形接続"
]

# 说明：
# 「〜かけだ」表示“做〜做到一半”“还没完成”的状态。
# 接续：動詞の連用形（ます形去掉ます）＋かけだ
# 例如：
# ・食べかけのパン（吃了一半的面包）
# ・読みかけの本（读到一半的书）
# 因此本题中应选择「読み」，即「読みかけだった」＝“读到一半的（书）”。
# 整句意思：上周末把之前读到一半的三本书全部读完了。
