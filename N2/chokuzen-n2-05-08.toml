id = "chokuzen-n2-05-08"
level = "N2"

[question]
text = "よっぱらい運転は、運転者（　）ほかの人々をも危険にさらす。"
choices = ["だけに", "わりに", "ばかりか", "というと"]
correct = "ばかりか"

[grammar]
main = "〜ばかりか（不仅……而且……）(ばかりではなく, か相当于ではなく)"
related = ["〜だけに", "〜わりに", "〜というと"]
tags = [
    "level/N2",
    "grammar/ばかりか",
    "function/添加・递进",
    "pattern/普通形＋ばかりか"
]

# 📘 〜ばかりか
# 含义：不仅……而且……。前后两个事实递进出现，后项常带“更进一步”“出乎意料”的语气。
# 接续：普通形＋ばかりか（ナ形容词＋な／名词＋である）
# 例句：彼は遅刻したばかりか、宿題も忘れた。
# 本题中「運転者ばかりか、ほかの人々をも危険にさらす」表示“不仅司机本人，还让其他人陷入危险”。

# 🚫 〜というと
# 含义：提起、说到（用来引出话题）
# 例句：日本というと、桜を思い出します。
# 本题不是话题引出句，而是两个对象并列比较，所以不能用というと。
