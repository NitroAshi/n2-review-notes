id = "past10B-n2-039"
level = "N2"

[question]
text = "このたびは、私どもの商品発送ミスにより、お客様に大変ご迷惑をかけましたことを深く（　）。申し訳ございませんでした。"
choices = ["わびていただきます", "わびていらっしゃいます", "おわびいただきます", "おわび申し上げます"]
correct = "おわび申し上げます"

[grammar]
main = "お（ご）～申し上げます（謙譲語）"
related = ["お詫びする", "申し上げる（言う的謙譲語）"]
tags = [
    "level/N2",
    "grammar/お～申し上げます",
    "function/謙譲語",
    "pattern/敬語・ビジネス"
]

# 💬补充说明：
# 「申し上げます」是「言う」的謙譲語，用于表达“我方郑重地说/表示”。
# 「お詫び申し上げます」是商务信函、公告、正式发言中最常见的道歉表达。
# 例：ご迷惑をおかけしましたことを深くお詫び申し上げます。
# 「わびる」的基本动词形式太直接，不适合书面敬语语境。
