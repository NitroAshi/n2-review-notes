id = "past23A-n2-031"
level = "N2"

[question]
text = "この小説は、物語が進む（　）主人公の少年の心理が変化していくのが面白い。"
choices = ["としても", "とはいえ", "につれて", "にあたって"]
correct = "につれて"

[grammar]
main = "〜につれて"
related = ["〜にしたがって", "〜について", "〜ついでに", "〜にあたって"]
tags = [
    "level/N2",
    "grammar/につれて",
    "function/変化",
    "pattern/連体修飾"
]

# 🧩簡易まとめ：
# につれて：随着A变化B也变化（自然变化）→ 経済が発展するにつれて生活が豊かになる。
# について：关于A这个话题（说明・讨论）→ 日本の歴史について調べる。
# ついでに：做A时顺便做B（附带行为）→ 買い物のついでに郵便を出す。
# にあたって：在做A这个重要行为时（正式场合）→ 入学にあたって挨拶をする。
# 🔑记忆法：「つれて＝随」「ついて＝关」「ついで＝顺」「あたって＝当」
