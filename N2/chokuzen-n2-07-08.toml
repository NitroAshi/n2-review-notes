id = "chokuzen-n2-07-08"
level = "N2"

[question]
text = "きょうは雷が鳴る（　）地震が起きる（　）、なんだか普通じゃない。"
choices = ["にしろ／にしろ", "につけ／につけ", "やら／やら", "も／も"]
correct = "やら／やら"

[grammar]
main = "〜やら〜やら（～啦～啦，用于列举，带有混乱或不安的语气）"
related = ["〜とか〜とか", "〜だの〜だの", "〜や〜など"]
tags = [
  "level/N2",
  "grammar/やらやら",
  "function/列挙・混乱",
  "pattern/口語表現"
]

[notes]
"にしろ／にしろ" = "表示‘无论～也～’，用于让步或条件句（例：行くにしろ行かないにしろ連絡してください）。本句并非让步，而是并列罗列现象，错误。"
"につけ／につけ" = "表示‘每当～就～’，常用于情感或反应（例：写真を見るにつけ故郷を思い出す）。本句不表示反复感情，不合适。"
"やら／やら" = "表示‘～啦～啦’，用于列举同类事物或混乱情形（例：雨が降るやら風が吹くやら）。本句‘雷啦地震啦’语义正合。✅"
"も／も" = "简单并列‘也～也～’，语气平淡，无‘混乱、杂多’语感，不适合‘なんだか普通じゃない’这种语气。"
