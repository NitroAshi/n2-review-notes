id = "chokuzen-n2-06-04"
level = "N2"

[question]
text = "本日２時より、駅前の広場（　）候補者の演説があります。"
choices = ["にあたって", "に先立ち", "において", "にかけて"]
correct = "において"

[grammar]
main = "〜において（在……）"
related = ["〜で", "〜にて", "〜の場所で"]
tags = [
    "level/N2",
    "grammar/において",
    "function/場所・時間・状況",
    "pattern/書き言葉"
]

[explanation]
correct_usage = "「において」用于表示地点、时间、领域等正式语体中的“在……”。句中「駅前の広場において」＝“在车站前的广场”。"
wrong_choice_1 = "「にあたって」表示“值此……之际／在……的时候”，用于重要事件或仪式等时间表达，如「結婚にあたって」「留学にあたって」。不能用于表示地点。"
wrong_choice_2 = "「に先立ち」表示“在……之前”，语义不符。"
wrong_choice_3 = "「にかけて」表示“从……到……（时间或空间范围）”，不能用于具体地点。"
