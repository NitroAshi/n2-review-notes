id = "past22B-n2-033"
level = "N2"

[question]
text = "来年3月の完成（　）、新しい体育館の建設工事が着々と進んでいる。"
choices = ["を込めて", "に際して", "を通じて", "に向けて"]
correct = "に向けて"

[grammar]
main = "〜に向けて"
related = ["〜を目指して", "〜のために"]
tags = [
  "level/N2",
  "grammar/〜に向けて",
  "function/目的・準備",
  "pattern/名詞＋に向けて"
]

# 说明：
# ✅ 「〜に向けて」：表示“为了某个目标／时间点／方向”，即“朝着……、为了……而准备”。
#    句中「来年3月の完成に向けて」＝“为了明年3月完工”，表示工事正在朝着完工目标顺利推进。
#    例：試験に向けて一生懸命勉強している。（为了考试努力学习）
#
# ❌ 「〜に際して」：表示“在……之际／当……时”，用于正式场合，强调“时间点”。例如：
#    「開会に際して、一言ご挨拶申し上げます。」（在开会之际致辞）
#    本题不是“在完工之际”，而是“为了完工”——语义不同。
#
# ❌ 「〜を込めて」：表示“饱含感情地……”，如「感謝の気持ちを込めて手紙を書いた」。
# ❌ 「〜を通じて」：表示“通过……”“经由……”，如「一年を通じて温暖な気候だ」。
#
# ✅ 整句译文：
# 「为了明年3月完工，新体育馆的建设工程正在稳步推进中。」
