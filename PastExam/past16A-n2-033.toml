id = "past16A-n2-033"
level = "N2"

[question]
text = "この国で、卵、牛乳（　）3番目に多い食物アレルギーは、小麦アレルギーだ。"
choices = ["についで", "に沿って", "に代わって", "にしたがって"]
correct = "についで"

[grammar]
main = "〜についで（继……之后，次于……）"
related = ["〜について（关于……）", "〜にしたがって（随着……）"]
tags = [
    "level/N2",
    "grammar/についで",
    "function/顺序",
    "pattern/名詞＋についで"
]

# 备注：
# 「についで」与「について」读音相似但意思完全不同。
# 「についで」表示“继……之后”的顺序或次序。
# 「について」表示“关于……”的主题。
# 例句：東京についで大阪が大きい都市です。

# | 形式       | 构成           | 原始意义      | 引申后的语法意义     |
# | -------- | ------------ | --------- | ------------ |
# | **について** | に＋つく（附着）     | “附着在某主题上” | → 关于……、就……而言 |
# | **についで** | に＋つぐ（続く的连用形） | “紧跟在……之后” | → 继……之后、次于…… |
