id = "past16A-n2-043"
level = "N2"

[question]
text = "近所の図書館によく行くが、人気の本が貸し出し中で読めないことが多いので、もっと数を増やして、たくさんの人が読める（　）。"
choices = ["ようにしてほしい", "ようになりたい", "ようにすることができる", "ようになろうとしている"]
correct = "ようにしてほしい"

[grammar]
main = "〜ようにしてほしい（希望别人设法做到……）"
related = ["〜ようにする（自己设法做到）", "〜てほしい（希望别人做某事）"]
tags = [
    "level/N2",
    "grammar/ようにしてほしい",
    "function/希望表現",
    "pattern/動詞原形＋ようにしてほしい"
]

# 备注：
# 「〜ようにしてほしい」表示“希望对方设法做到……”，说话人强调希望他人采取行动。
# 本题主语是“图书馆”，因此不能用表示自己意愿的「〜ようになりたい」。
# 对比：「〜ようにする」是说话人自己努力去做。
# 例句：静かにするようにしてほしい。（希望你安静点。）
