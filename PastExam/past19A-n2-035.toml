id = "past19A-n2-035"
level = "N2"

[question]
text = "田中「ねえ、明日のイベントの準備、終わった？」\n小川「まだ終わってないけど、まあ、大丈夫だよ。」\n田中「（　）小川さんの楽観的な性格がうらやましいよ。」"
choices = ["そんなに", "あんなに", "そういう", "ああいう"]
correct = "そういう"

[grammar]
main = "そういう：对方刚刚表现／说出的那种（连体词）"
related = ["ああいう", "そんなに（程度副詞）", "連体詞の用法"]

tags = [
  "level/N2",
  "grammar/指示詞",
  "function/指代",
  "pattern/そういう＋名詞"
]

# 注释：
# - 「そういう」用于指代对方刚刚说/做的内容，因此修饰名词最自然。
# - 「そんなに」「あんなに」是程度副词，不能直接放在名词前。
# - 「ああいう」修饰名词虽可，但比起「そういう」，语气更远指，不如本题自然。
