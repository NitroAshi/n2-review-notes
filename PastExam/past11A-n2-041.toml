id = "past11A-n2-041"
level = "N2"

[question]
text = "顔を洗うときには、せっけんを（　）、さっと洗うのが肌にはよい。"
choices = ["使いすぎずに", "使いにすぎず", "使いにすぎなく", "使いすぎもなくて"]
correct = "使いすぎずに"

[grammar]
main = "〜ずに"
related = ["〜すぎる", "〜ないで", "〜すぎない"]
tags = [
    "level/N2",
    "grammar/〜ずに",
    "function/否定接续",
    "pattern/連用形・書き言葉"
]

# 注释：
# 「〜ずに」＝「〜ないで」，表示“不～而～”、“没～就～”，语气更书面。
# 「使いすぎる」＝用得太多，「使いすぎずに」＝不过度使用。
# 「〜すぎる」接动词ます形，表示“过度”；结合否定「〜すぎずに」表示“不过度地～”。
# 句意：洗脸时不要用太多肥皂，轻轻洗一下对皮肤更好。
