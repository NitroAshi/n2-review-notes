id = "past22A-n2-042"
level = "N2"
mistakes = 2

[question]
text = "私が教えている経営学の講義では、去年から、毎回学生に講義の感想や質問を書いて（　）。そこから気づかされることも多いからだ。"
choices = ["出してもらうことにしている", "出してもらうことがある", "出してあげることにしている", "出してあげることがある"]
correct = "出してもらうことにしている"

[grammar]
main = "～ことにしている"
related = ["～ことがある", "～ことにする"]
tags = [
  "level/N2",
  "grammar/ことにしている",
  "function/習慣・規則",
  "pattern/敬語・授業表現"
]

# 🟩 各选项详解
# 1. 出してもらうことにしている：
#    意思：规定让学生交（感想）→ 表示习惯或规则。
#    例句：毎朝走ることにしている。→ 我规定每天跑步。
#    ✅ 正确答案。

# 2. 出してもらうことがある：
#    意思：有时请学生交（感想）→ 表示偶尔。
#    例句：時々外食することがある。→ 有时会外出吃饭。
#    ❌ 与「毎回」矛盾。

# 3. 出してあげることにしている：
#    意思：我帮他们交（感想）→ 主语错误。
#    ❌ 语义不通。

# 4. 出してあげることがある：
#    意思：我偶尔帮他们交？→ 主语错误。
#    ❌ 不自然。
