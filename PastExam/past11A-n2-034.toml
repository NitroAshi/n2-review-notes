id = "past11A-n2-034"
level = "N2"

[question]
text = "あれこれ悩んだ（　）、ABC大学を志望校に決めた。"
choices = ["さきに", "すえに", "ところに", "とおりに"]
correct = "すえに"

[grammar]
main = "〜末（に）"
related = ["〜た結果", "〜あげく", "〜たところ"]
tags = [
    "level/N2",
    "grammar/〜末に",
    "function/经过后的结果",
    "pattern/連用修飾・書き言葉"
]

# 注释：
# 「〜末に」表示经过长时间的思考或努力后，终于得出结论。
# 接续：動詞た形 + 末に／名詞 + の末に
# 用于强调经过反复过程后得到的“最终结果”，多为书面表达。
# 与「〜あげく」的区别：
#   「〜あげく」多带负面结果；
#   「〜末に」则可用于中性或积极结果。
