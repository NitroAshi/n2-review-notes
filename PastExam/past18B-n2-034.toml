id = "past18B-n2-034"
level = "N2"

[question]
text = "X社の調査によると、共働き夫婦における夫の家事負担の割合は、夫の年齢が（　）にしたがって増加しているという。"
choices = ["下がる", "下がっている", "下がった", "下がっていた"]
correct = "下がる"

[grammar]
main = "〜にしたがって：随着A变化，B也随之变化"
related = ["につれて", "動詞辞書形 + にしたがって"]

tags = [
  "level/N2",
  "grammar/にしたがって",
  "function/变化・递进",
  "pattern/動詞辞書形接続"
]

# 注释：
# - 「にしたがって」前必须是“变化”而不是“状态”，所以要用動詞原形。
# - 「下がっている」表示状态，无法与「にしたがって」搭配。
