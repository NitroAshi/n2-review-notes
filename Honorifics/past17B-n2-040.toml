id = "past17B-n2-039"
level = "N2"

[question]
text = "客「すみません、『山の中で』っていう本を探しているんですけど。」 店員「はい、新刊コーナーに（　）。ご案内します。」"
choices = ["いたします", "おります", "ございます", "なさいます"]
correct = "ございます"

[grammar]
main = "ございます：ある的丁寧語，用于礼貌地说明物品或场所的存在，是接客场景常用表达。"
related = ["あります（普通体）", "おります（いる的自谦語）", "いたします（する的自谦語）", "なさいます（する的尊敬語）"]
tags = [
  "level/N2",
  "grammar/ございます",
  "function/敬語・丁寧語",
  "pattern/接客表現"
]

# 选项释义补充
# 1. いたします：する的自谦语，用于表达“自己做…”；不能用于描述物品的存在。
# 2. おります：いる的自谦语，用于“自己人”的存在，不用于物体，不用于对顾客。
# 3. ございます：ある的丁寧語，用于表示物品的位置/存在，是本题正确答案。
# 4. なさいます：する的尊敬语，用来尊敬对方的动作，不用于说明物的位置。
