id = "past22B-n2-032"
level = "N2"

[question]
text = "子供のころはピーマンが嫌いだったが、今は嫌いではない。（　）好きな野菜の一つだ。"
choices = ["むしろ", "いったい", "そのうち", "ちっとも"]
correct = "むしろ"

[grammar]
main = "むしろ"
related = ["それどころか", "反対に"]
tags = [
  "level/N2",
  "grammar/むしろ",
  "function/逆接・对比",
  "pattern/副詞"
]

# 说明：
# ✅ 「むしろ」：副词，表示“与前项相反、反而、倒不如”。用于强调出人意料的对比转折。
#    本句意思是：“小时候讨厌青椒，但现在倒是喜欢的蔬菜之一。”形成“过去讨厌 ↔ 现在喜欢”的鲜明对比。
#    例：失敗は恥ずかしいことではない。むしろ大切な経験だ。
#
# ❌ いったい：副词，用于疑问句或反问，表示“究竟、到底”，如「いったい何をしているの？」。
# ❌ そのうち：副词，表示“过一会儿、不久、将来”，如「そのうちわかるよ」（不久就会明白）。
# ❌ ちっとも：副词，常与否定形连用，表示“丝毫不〜”，如「ちっとも眠くない」。
#
# 因此句意应为：
# 「小时候讨厌青椒，但现在却成了喜欢的蔬菜之一。」→ 取「むしろ」最自然。
