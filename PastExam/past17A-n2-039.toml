[question]
text = "A「ねえねえ、夏休みのキャンプ、楽しみだね。」 B「うん。早く夏休みに（　）。」"
choices = ["なるかな", "ならないかな", "なるんだね", "ならないんだね"]
correct = "ならないかな"

[grammar]
main = "〜ないかな（希望・愿望）"
related = ["〜たいなあ", "〜といいな", "〜ばいいのに"]

tags = [
  "level/N2",
  "grammar/〜ないかな",
  "function/愿望・希望",
  "pattern/口語表現"
]

# 注释:
# 「〜ないかな」形式上是动词否定形＋かな，但语义上常用于表达希望、期待、感叹。
# 例: 「早く春にならないかな」＝「希望春天快点来啊」。
# 属于口语常用表达，语气柔和、自然。
