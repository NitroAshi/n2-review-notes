id = "past17A-n2-043"
level = "N2"

[question]
text = "妹「ねえ、ベランダに干しておいた私のTシャツがないんだけど、知らない？」 姉「そうなの？ 今日、風強かったから、飛ばされて外に（　）？」"
choices = ["落ちちゃったんだって", "落ちちゃったんじゃない", "落としちゃったんだって", "落としちゃったんじゃない"]
correct = "落ちちゃったんじゃない"

[grammar]
main = "〜んじゃない？（推测・轻微确认）"
related = ["〜んだって（转述他人说法）", "〜のではないか（书面形）"]
tags = [
  "level/N2",
  "grammar/〜んじゃない",
  "function/推测・确认",
  "pattern/口语表达"
]

# 注释:
# 【句意】“今天风挺大的，可能被吹下去掉到外面去了吧？”
#
# 【语法区别】
# ・〜んじゃない？＝“是不是～啊？”表示说话人的推测或轻微确认。
#   例：「雨、降ってきたんじゃない？」→“是不是下雨了？”
# ・〜んだって＝“听说～”用于转述他人说的话。
#   例：「田中さん結婚したんだって。」→“听说田中结婚了。”
#
# 【自动词 vs 他动词】
# ・落ちる（自动词）：东西自己掉下去。→ 本题正确用法。
# ・落とす（他动词）：人为使物掉下去。→ 不符语境。
#
# 【选项说明】
# 1. 落ちちゃったんだって：听说掉下去了（×不是转述）。
# 2. 落ちちゃったんじゃない（○推测，语境自然）。
# 3. 落としちゃったんだって：听说弄掉了（×动词错误）。
# 4. 落としちゃったんじゃない：是不是你弄掉的？（×语气过强且错误推测对象）。
