id = "chokuzen-n2-07-05"
level = "N2"

[question]
text = "服が汚れるの（　）、彼はけがをした人を抱きかかえた。"
choices = ["を問わず", "につけ", "もかまわず", "にしろ"]
correct = "もかまわず"

[grammar]
main = "〜もかまわず（不顾、不介意……）"
related = ["〜を問わず", "〜にもかかわらず", "〜にしろ〜にしろ"]
tags = [
  "level/N2",
  "grammar/もかまわず",
  "function/逆接・無視",
  "pattern/書き言葉"
]

[notes]
"を問わず" = "表示‘不论～都～’，用于分类或范围广泛的情况，如：性別を問わず。此处是具体情境，不合适。"
"につけ" = "表示‘每当～就～’（感情或反应），如：写真を見るにつけ故郷を思い出す。本句不表示反复行为。"
"もかまわず" = "表示‘不顾～而～’，如：人目もかまわず泣いた。此处‘不顾衣服弄脏’语义完全契合。✅"
"にしろ" = "表示‘即使～也～’或‘无论～也～’，如：行くにしろ行かないにしろ。语气条件性，不适合此处。"
