id = "past18A-n2-037"
level = "N2"

[question]
text = "散歩が大好きなうちの犬が今日は散歩に（　）。具合でも悪いのだろうか。"
choices = ["行きたがらなかった", "行かなければよかった", "行ってほしくなかった", "行きたくなかった"]
correct = "行きたがらなかった"

[grammar]
main = "〜たがる（第三人称の欲求・態度）"
related = ["〜たい（第一人称）", "〜たがらない（否定形）"]

tags = [
  "level/N2",
  "grammar/たがる",
  "function/様子判断",
  "pattern/動詞変化"
]

# ---- 补充说明 ----
# ・「〜たがる」表示第三人称“表面上看起来想做某事”的样子，用于描述外在行为，而不是内心真实欲望。
# ・本题中说话人无法知道狗的真实想法，只能从行为表现判断，因此必须使用「行きたがらなかった」。
# ・「行きたくなかった」从语法意义上可能表示“它内心不想”，但不自然，也不符合第三人称愿望表达的标准。
# ・「行かなければよかった」「行ってほしくなかった」都与语境的推测意义不符。
