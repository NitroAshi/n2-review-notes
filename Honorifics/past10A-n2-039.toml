id = "past10B-n2-039"
level = "N2"

[question]
text = "（メールで）田中です。先日お話があったスピーチの件なんですが、ぜひ私に（　）。"
choices = ["やっていただけないでしょうか", "やらせていただけないでしょうか", "やってもよろしいでしょうか", "やらせてもよろしいでしょうか"]
correct = "やらせていただけないでしょうか"

[grammar]
main = "～させていただけないでしょうか（謙逊请求）"
related = ["～てもよろしいでしょうか（礼貌许可）", "～させていただく（谦让语原型）"]
tags = [
    "level/N2",
    "grammar/させていただけないでしょうか",
    "function/謙譲語・依頼",
    "pattern/書き言葉・ビジネス"
]

# 💬補充说明（含语法原型解析）：
# ────────────────────────────────
# ✅ 本题正确答案「やらせていただけないでしょうか」的原型结构如下：
# 原型公式：V(使役形)＋て＋いただく
#           ↓
# ＝「～させていただく」→ 表示“蒙对方允许，我来做～”，属謙譲語。
# 在此基础上加上「～ないでしょうか」形成更委婉的请求句：
# 「～させていただけないでしょうか」＝能否请允许我来做～？
#
# ▪ 敬语层次与原型对照：
# ┌─────────────────────┬────────────────────────┐
# │ 基本许可表达         │ 动词て形 + も + いい                    │
# │                      │ → “可以～”                             │
# │ 礼貌许可表达         │ 动词て形 + も + よろしい               │
# │                      │ → “可以～吗（更礼貌）”                │
# │ 谦逊请求表达         │ 动词使役形 + て + いただく             │
# │                      │ → “蒙您允许让我做～（谦让）”          │
# └─────────────────────┴────────────────────────┘
#
# 🔹 举例：
#  - 書かせていただく＝蒙您允许让我写。
#  - 発表させていただけないでしょうか＝能否请允许我来发言？
#
# ❌ 错项「やらせてもよろしいでしょうか」：
# 原型：V(使役形)+ても+よろしい＝“让我做可以吗？”
# 语气礼貌，但主语仍是“我方判断”，不含谦让成分；
# 效果只是“我可以做吗？”而非“能否蒙您允许我来做？”。
#
# ▪ 对比总结：
# 「～てもよろしいでしょうか」＝许可型 polite
# 「～させていただけないでしょうか」＝谦逊型 humble polite
# 两者语法系统不同：前者源自动词＋てもいい系，后者源自使役＋いただく系。
