id = "past10B-n2-054"
level = "N2"
mistaskes = 2

[question]
text = "花粉症の人もそうでない人も、春は過ごし方に少し（　）。"
choices = ["気をつけてみたらどうでしょうか", "気をつけたほうがいいのでしょうか", "気をつけているそうです", "気をつければよかったです"]
correct = "気をつけてみたらどうでしょうか"

[grammar]
main = "～たらどうでしょうか（委婉な提案）"
related = ["～たらどうですか", "～たほうがいい"]
tags = [
    "level/N2",
    "grammar/たらどうでしょうか",
    "function/勧誘・提案",
    "pattern/書き言葉・丁寧"
]

# 💬補充说明：
# 「～たらどうでしょうか」用于提出礼貌的建议或提案。
# 与「～たらどうですか」相比，语气更柔和、更正式。
# 「でしょう」在这里不是推测，而是语气缓和词。
# 错误选项4「～ばよかった」表示后悔，与本文“劝告”语境不符。

# | 语气强度      | 表达          | 中文语感        |
# | --------- | ----------- | ----------- |
# | でしょう（↓）   | “大概～吧。”     | 带判断、陈述气     |
# | でしょうか（↑）  | “～吗？”、“～呢？” | 礼貌地征询对方意见   |
# | でしょうね（带ね） | “是吧？”       | 轻微确认语气      |
# | でしょうよ（带よ） | “肯定是啊！”     | 强调、主张语气（口语） |

