# 🟩 语法要点与区别说明

# 🔸「～ために」—— 表示“为了实现目的”  
# ・用于主语有意志、能主动完成的行动  
# ・相当于中文“为了（去做某事）”——强调“可控制的目的”  
# 例：
#   日本語を勉強するために日本へ行った。→ 为了学习日语去了日本。
#   健康のために運動している。→ 为了健康而锻炼。

# 🔸「～ように」—— 表示“为了希望某结果出现”  
# ・用于主语无法直接控制的状态或结果  
# ・相当于中文“希望能…… / 以便能……”——强调“祈愿或结果性的为了”  
# 例：
#   早く元気になるように祈っています。→ 祈愿你早日康复。
#   日本語が上手になるように毎日練習している。→ 希望自己日语能变好而练习。

# 🧩 对比总结
# 「ために」＝ 为了实现明确目标（能动、实际行动）
# 「ように」＝ 为了让某事发生（非能动、祈愿）
# 本题中“让城市更安全”是人类主动规划与建设的目标，
# 所以用「するために」而非「なるように」。

# 🟦 错误选项说明
# 1. しても：
#    意思：即使……也……
#    ❌ 不表示目的，语气完全不符。
#
# 3. なったように：
#    意思：如同变成……一样；好像变得……
#    ❌ 表比喻或结果状态，非目的。
#
# 4. なってはじめて：
#    意思：只有在……之后，才……
#    ❌ 表条件限定，与句意不符。
