id = "past23A-n2-042"
level = "N2"

[question]
text = "（インタビューで）選手「今回優勝できたのは、多くの方に（　）。本当にありがとうございました。」"
choices = [
    "応援してくださったおかげです",
    "応援していただいたおかげです",
    "応援してくださったことだと思います",
    "応援していただいたことだと思います"
]
correct = "応援していただいたおかげです"

[grammar]
main = "〜ていただく（謙譲語）＋おかげで"
related = ["〜てくださる（尊敬語）", "〜おかげで"]
tags = [
    "level/N2",
    "grammar/ていただく",
    "function/敬語",
    "function/感謝",
    "pattern/謙譲語"
]

# 🧩簡易まとめ：
# ていただく：谦让语＝承蒙对方为自己做～。
# てくださる：尊敬语＝对方为自己做～。
# おかげで：多亏～（表达感谢的原因）。
# → 応援していただいたおかげです：谦虚地表达“承蒙大家支持”。
# 🔑记忆法：面对大众或第三方表达感谢时用「いただく」，直接对对方则用「くださる」。
