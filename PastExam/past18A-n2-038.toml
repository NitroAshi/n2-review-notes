id = "past18A-n2-038"
level = "N2"

[question]
text = "高速道路建設に反対している市民も少なくないのだから、市長として、そのことを無視して建設計画を（　）」と述べた。"
choices = ["進めそうにない", "進めてもかまわない", "進めずにはいられない", "進めるわけにはいかない"]
correct = "進めるわけにはいかない"

[grammar]
main = "～わけにはいかない"
related = ["～ことはできない", "～てはいけない（禁止）"]

tags = [
  "level/N2",
  "grammar/わけにはいかない",
  "function/義務・禁止",
  "pattern/動詞辞書形＋わけにはいかない"
]

# ---- 补充说明 ----
# ・「〜わけにはいかない」：基于社会常识／道义／立场的理由，不能做某事。本题中是“作为市长不能无视市民反对”。
# ・「進めそうにない」：外观判断“看样子推进不了”，是能力／状况预测，不适合政治立场判断的语境。
# ・「進めてもかまわない」与市民反对的理由矛盾。
# ・「進めずにはいられない」表示“不得不推进”，语义完全相反。
