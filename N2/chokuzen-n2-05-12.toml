id = "chokuzen-n2-05-12"
level = "N2"

[question]
text = "明日こそ、皆でわが校サッカー部の試合を応援しに（　）。"
choices = ["行くものか", "行こうではないか", "行くこそ", "行くんだっけ"]
correct = "行こうではないか"

[grammar]
main = "〜（よ）うではないか（让我们……吧）"
related = ["〜行くんだっけ", "〜ものか"]
tags = [
    "level/N2",
    "grammar/（よ）うではないか",
    "function/提案・呼びかけ",
    "pattern/V意向形＋ではないか"
]

# 📘 〜（よ）うではないか
# 含义：用于呼吁、号召，“让我们……吧”“一起来……吧”。
# 接续：動詞意向形＋ではないか（口语：じゃないか）
# 例句：みんなで協力しようではないか。（让我们齐心协力吧）
# 本题「行こうではないか」＝“让我们去吧”，表达鼓动。

# 🚫 〜行くんだっけ
# 含义：用于回忆确认，“是要去来着？”语气柔和、回忆。
# 例句：明日行くんだっけ？（明天是要去吗？）
# 本题语气为号召而非确认，故不合适。
