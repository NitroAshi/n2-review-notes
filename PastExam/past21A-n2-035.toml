[question]
text = "昨夜よく眠れなかった（　）、体がだるい。"
choices = ["からには", "わけか", "あまりに", "せいか"]
correct = "せいか"

[grammar]
main = "せいか（〜のせいか）"
related = ["せい", "せいで", "せいにする"]
tags = [
    "level/N2",
    "grammar/せいか",
    "function/原因・推測",
    "pattern/口語・柔らかい表現"
]

# 各选项含义：
# 1. からには：既然……就……；表示意志或义务（如「やるからには頑張る」）
# 2. わけか：✖ 无此语法形式（可能混淆「わけだ」「わけではない」）
# 3. あまりに：太……；表示程度过高导致的结果
# 4. せいか：也许是因为……吧；用于推测原因（多为消极结果）✅

# 🌸「せい」系列语法对照整理：
# 1. 〜せいで：明明是因为……（确定原因，带有责备语气）
#    例：彼の言い方がきつかったせいで、みんなが怒った。
#        → 都是因为他说话太冲，大家才生气。
#
# 2. 〜せいか：也许是因为……吧（推测原因，不确定语气）✅
#    例：彼の言い方がきつかったせいか、みんなが怒った。
#        → 也许是因为他说话太冲，大家生气了。
#
# 3. 〜せい：名词形用法，常接「〜のせい」「〜のせいにする」
#    表示“因为某人／某事”，通常带负面含义。
#    例：雨のせいで遅れた。→ 因为下雨迟到了。
#
# 4. 〜のせいにする：把责任推给……；责怪他人
#    例：失敗を人のせいにするな。→ 不要把失败怪到别人头上。
#
# ✅区分要点：
# 「せいで」＝确定原因（责备语气）
# 「せいか」＝推测原因（柔和语气）
# 「せいにする」＝归咎责任
# 「せい」＝名词化用法（原因名词）
