id = "past10B-n2-036"
level = "N2"
mistaskes = 2

[question]
text = "Ａ「昨日、サッカーの試合見に行ったんでしょ？どうだった？」Ｂ「それが、ミスの連続でね…（　）プロの試合とは思えない内容だったよ。」"
choices = ["なんて", "仮に", "とても", "二度と"]
correct = "とても"

[grammar]
main = "とても～ない（完全否定）"
related = ["まったく～ない", "少しも～ない", "決して～ない"]
tags = [
    "level/N2",
    "grammar/とても～ない",
    "function/程度・否定強調",
    "pattern/口語表現"
]

# 💬補充说明：
# 「とても～ない」表示“无论如何都不……”“完全不……”，是强烈的否定表达。
# 例：とても一人ではできない（一个人根本做不到）。
# 「二度と」表示“再也不……”，用于将来行为否定，如「二度と行かない」。
# 本题中「思えない」表示感想判断，无法与「二度と」搭配。
