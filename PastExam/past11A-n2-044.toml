id = "past11A-n2-044"
level = "N2"

[question]
text = "A「このタレント、最近よくテレビで見るね。」 B「ほんと。この人を見ない日はない（　）よね。」"
choices = ["と言ってもいいくらいだ", "と言ったらいいだけだ", "と言ってもいいからだ", "と言ったらいいことだ"]
correct = "と言ってもいいくらいだ"

[grammar]
main = "〜といってもいいくらいだ"
related = ["〜といってもいいほどだ", "〜くらい", "〜ほど"]
tags = [
    "level/N2",
    "grammar/〜といってもいいくらいだ",
    "function/程度表达",
    "pattern/書き言葉・評価表現"
]

# 注释：
# 「〜といってもいいくらいだ」表示“几乎可以说～”，用于强调程度高。
# 接续：普通形 + といってもいい + くらい／ほど + だ
# 类似表达：
#   「〜といってもいいほどだ」＝“甚至可以说～”
#   「〜くらい／ほど」＝“～的程度”
# 句意：真的，几乎可以说没有一天不见到这个人（程度很高）。

# "と言ったらいいことだ"
# “要是能说～就好了”→ 表假设愿望，不合语气s