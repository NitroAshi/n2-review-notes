id = "chokuzen-n2-06-09"
level = "N2"

[question]
text = "このスープは色（　）辛そうだ。"
choices = ["からして", "をはじめとして", "からには", "にかわって"]
correct = "からして"

[grammar]
main = "〜からして（从……来看／连……都……）"
related = ["〜から見ると", "〜から言うと", "〜にしても"]
tags = [
    "level/N2",
    "grammar/からして",
    "function/判断・評価",
    "pattern/名詞＋からして"
]

[explanation]
correct_usage = "「からして」表示“从……来看”，用于根据部分特征作出整体推测。句意：‘这汤光从颜色看就觉得辣’。"
wrong_choice_2 = "「をはじめとして」表示‘以……为首’，用于举出代表例，与判断无关。"
wrong_choice_3 = "「からには」表示‘既然……就……’，接普通形，不接名词，语法错误。"
wrong_choice_4 = "「にかわって」表示‘代替……’，语义不符。"
