id = "chokuzen-n2-05-01"
level = "N2"

[question]
text = "この寺は、あじさいという花で有名な（　）、あじさい寺と呼ばれています。"
choices = ["ことには", "ことから", "ことだから", "ものなら"]
correct = "ことから"

[grammar]
main = "〜ことから（表示原因、由来）"
related = ["〜ことだから", "〜ことには"]
tags = [
    "level/N2",
    "grammar/ことから",
    "function/原因・由来",
    "contrast/ことだから（用于推测人的性格或行为）",
    "pattern/名詞+である＋ことから"
]

# 📘 〜ことから
# 含义：表示“因为……这一事实”“由……得知”“因此而……”
# 用法：说明原因、根据或命名的由来
# 接续：普通形（ナ形容词+な／名词+である）＋ことから
# 例句：名古屋は城があることから、「城下町」と呼ばれている。
#       （因为有城，所以被称为“城下町”。）

# 🚫 〜ことだから
# 含义：表示“正因为是……所以……”
# 用法：用于主观推测或评价，通常用于人（表示对某人的性格、习惯的推测）
# 接续：名词＋のことだから
# 例句：真面目な彼のことだから、きっと約束を守るだろう。
#       （正因为他很认真，一定会遵守约定。）
# ❌ 不能用于表示“命名的由来”或“事实原因”，因此本题不能用ことだから。
