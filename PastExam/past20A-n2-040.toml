id = "past20A-n2-040"
level = "N2"

[question]
text = "この馬の絵は本物そっくりに描かれていて、今にも（　）。"
choices = ["走っていたい", "走っているようだ", "走り出しそうだ", "走り出したがる"]
correct = "走り出しそうだ"

[grammar]
main = "〜そうだ（表示样态，似乎就要〜）"
related = ["〜ようだ", "〜みたいだ", "〜らしい"]
connection = "動詞ます形（去ます）＋そうだ"
tags = [
  "level/N2",
  "grammar/そうだ",
  "function/様態・推量",
  "pattern/感想・描写"
]

# 🧩 解析：
# 核心语法是「〜そうだ」，这里不是“听说”，而是表示**样态（様態そうだ）**，
# 即“眼看就要〜”“似乎要〜的样子”。
#
# ✅ 句意：
# 这匹马的画画得栩栩如生，看起来现在就要跑起来一样。
# → 「今にも走り出しそうだ」= “It looks as if it’s about to start running any moment.”
#
# 「今にも」通常和「〜そうだ」搭配使用，表示“眼看就要发生某事”，
# 是极强的视觉印象用法，而非主观推测。
#
# 🟥 为什么不是「走っているようだ」？
# 「〜ようだ」表达“看起来像〜”，It seems that
# 「〜そうだ」表达“似乎马上就要〜”，It looks
#
# 举例对比：
# - 馬が走っているようだ。→ 看起来像马在跑（状态描写）
# - 馬が今にも走り出しそうだ。→ 看起来马上就要跑起来（动作即将发生）
#
# 所以本题的关键是副词「今にも」，它强烈提示要用“样态そうだ”，而非“ようだ”。
#
# 💬 英文解释：
# 「〜そうだ（様態）」＝ *looks like / seems about to ...*
# 「〜ようだ」＝ *appears as if / looks like (state)*  
# → “The horse looks so real that it seems about to run any moment now.”
#
# ✅ 记忆重点：
# | 语法 | 含义 | 常见搭配 | 例句 |
# |------|------|------------|------|
# | 〜ようだ | 看起来像（静态） | 外見・様子 | 彼は子どものようだ。 |
# | 〜そうだ（様態） | 眼看就要（动态） | 今にも・まるで | 雨が降りそうだ。 |
#
# 💡提示：
# - 「ようだ」＝“像……一样” → 描述外观（静态）
# - 「そうだ（様態）」＝“要……的样子” → 表达即将变化（动态）
