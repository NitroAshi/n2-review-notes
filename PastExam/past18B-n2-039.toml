id = "past18B-n2-039"
level = "N2"

[question]
text = "昨日私が乗った飛行機は、今まで乗ったどの（　）小さかった。"
choices = ["飛行機のわりに", "飛行機よりも", "飛行機がいちばん", "飛行機のほうが"]
correct = "飛行機よりも"

[grammar]
main = "A は B より〜：A 比 B 更…"
related = [
  "A のほうが B より〜",
  "より（比較基準）",
  "のほうが（比較結果）"
]

tags = [
  "level/N2",
  "grammar/比較",
  "function/比较",
  "pattern/より"
]

# 注释：
# - 本句已固定主语（比較結果）为「昨日私が乗った飛行機」，因此用 A は B より〜 即可。
# - 「のほうが」需要用在比較結果 A 上，但本句中 A 已明确为主语，不适合插入「のほうが」。
# - 「より」后接比較基準，放在「どの飛行機」后最自然。
