id = "chokuzen-n2-06-07"
level = "N2"

[question]
text = "妹は理解が遅いが、一生懸命さ（　）だれにも負けない。"
choices = ["からには", "にしては", "からといって", "にかけては"]
correct = "にかけては"

[grammar]
main = "〜にかけては（在……方面）"
related = ["〜に関して", "〜について", "〜の点で"]
tags = [
    "level/N2",
    "grammar/にかけては",
    "function/比較・評価",
    "pattern/名詞＋にかけては"
]

[explanation]
correct_usage = "「にかけては」表示“在……方面（具有优点或特长）”。句意为“在努力这一点上不输给任何人”。"
wrong_choice_1 = "「からには」表示“既然～就～”，用于表示理所当然的义务或决定，不接名词，语法错误。"
wrong_choice_2 = "「にしては」表示“就～来说（出乎意料）”，语义为反常，与本句的比较语气不符。"
wrong_choice_3 = "「からといって」表示“虽说～但～（让步转折）”，句中没有对比转折关系，不成立。"
