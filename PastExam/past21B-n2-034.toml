# --- 各选项语法说明 ---

# ✅ というより
# 意味：与其说是A，不如说是B；用于修正前项的评价
# 接续：普通形（名詞・形容詞・動詞）＋というより
# 例文：
#   ・彼は友達というより、兄のような存在だ。→ 与其说是朋友，不如说像哥哥。
#   ・暑いというより、むしろ蒸し暑い。→ 与其说热，不如说闷。

# ❌ に限らず
# 意味：不仅～，不局限于～
# 接续：名詞＋に限らず
# 例文：
#   ・学生に限らず、大人もこの本を読む。→ 不仅学生，大人也读这本书。
# 说明：本题后句不是并列或范围扩展关系，而是比喻，因此不成立。

# ❌ なしには
# 意味：如果没有～就无法…
# 接续：名詞＋なしには＋动词否定形
# 例文：
#   ・努力なしには成功できない。→ 没有努力就无法成功。
# 说明：本题不是“缺乏条件”的句型结构。

# ❌ のおかげで
# 意味：多亏～（积极结果）
# 接续：名詞＋のおかげで
# 例文：
#   ・先生のおかげで合格した。→ 多亏老师才合格。
# 说明：语义不符，本题是比喻表达。
