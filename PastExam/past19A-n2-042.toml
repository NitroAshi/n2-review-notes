id = "past19A-n2-042"
level = "N2"

[question]
text = "この映画を見て、私は今までこれほど何かに夢中に（　）と考えさせられた。"
choices = ["なることがあるだろうか", "なったことがあっただろうか", "することがあるだろうか", "したことがあっただろうか"]
correct = "なったことがあっただろうか"

[grammar]
main = "Vたことがあっただろうか：過去経験の自己反問（我曾经……过吗？）"
related = [
    "〜たことがある（过去经验）",
    "〜だろうか（自问・反问）",
    "夢中になる（入迷・沉迷）"
]

tags = [
  "level/N2",
  "grammar/過去経験",
  "function/自己反問",
  "pattern/Vたことがあっただろうか"
]

# 注释：
# - 本句是“回顾过去是否有过这种经验”，所以必须用「Vたことがあっただろうか」。
# - 「〜することがあるだろうか」表示未来可能性，不符语境。
# - 动词必须用「夢中になる」而不是「する」。
