id = "past22B-n2-037"
level = "N2"

[question]
text = "先月から食堂でアルバイトを始めた。お客さんがおいしいと（　）、うれしくなり、もっと頑張ろうと思える。"
choices = ["言ってあげるたびに", "言ってあげるように", "言ってくれるたびに", "言ってくれるように"]
correct = "言ってくれるたびに"

[grammar]
main = "〜たびに"
related = ["〜とき", "〜ごとに"]
tags = [
  "level/N2",
  "grammar/〜たびに",
  "function/反復・习惯",
  "pattern/動詞辞書形＋たびに",
  "敬語/くれる"
]

# 说明：
# ✅ 「〜たびに」表示“每当……的时候”。接动词辞書形或名词＋の。
#    「言ってくれるたびに」＝“每当客人对我说好吃的时候”。
#    整句：每当客人说“好吃”的时候，我就很高兴，也更想努力。
#
# ✅ 「〜てくれる」表示“别人为我做某事”，带有**受惠（感谢）**的语气，
#    比「〜てあげる」（我为别人做）更合适，因为这里说话者是“被客人夸”。
#
# ❌ 「言ってあげる」→“我对别人说”，主语错误；
# ❌ 「〜ように」→表示目的或祈愿，不符合“每次……就……”的语义。
#
# ✅ 句意：
# 「上个月开始在食堂打工。每当客人对我说‘好吃’时，就会感到高兴，觉得要更努力。」
