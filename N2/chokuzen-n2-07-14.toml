id = "chokuzen-n2-07-14"
level = "N2"

[question]
text = "この問題集は、実際の授業で使った教材を（　）作られている。"
choices = ["もとにして", "問わず", "こめて", "きっかけにして"]
correct = "もとにして"

[grammar]
main = "〜をもとにして（以……为基础，作为……的依据）"
related = ["〜をきっかけにして", "〜を元にして"]
tags = [
  "level/N2",
  "grammar/もとにして",
  "function/基于・依据",
  "pattern/書き言葉"
]

[notes]
"問わず" = "表示‘不论、不管’，通常用于表示不受条件限制（例：年齢を問わず参加できる）。本句不是表示不受限制，因此不合适。"
"こめて" = "表示‘倾注、包含’，常用于情感的注入（例：愛を込めて手紙を書く）。本句不是描述情感倾注，因此不适合。"
"もとにして" = "表示‘以……为基础’，用于描述某事物是基于其他事物制作的（例：実際の授業で使った教材をもとにして作られている）。✅"
"きっかけにして" = "表示‘以……为契机’，用于描述某事物作为行动的起点（例：このイベントをきっかけにして、多くの人が集まった）。本句不是描述契机或起点，因此不适合。"
