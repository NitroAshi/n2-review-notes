id = "chokuzen-n2-06-13"
level = "N2"

[question]
text = "本校では英語（　）とする７カ国語が学べます。"
choices = ["からして", "をめぐり", "をはじめ", "において"]
correct = "をはじめ"

[grammar]
main = "〜をはじめ（として）（以……为首／首先是……）"
related = ["〜を皮切りに", "〜を中心に", "〜など"]
tags = [
    "level/N2",
    "grammar/をはじめ",
    "function/列挙・代表例",
    "pattern/名詞＋をはじめ＋名詞"
]

[explanation]
correct_usage = "「をはじめ」表示‘以……为首’或‘以……为代表’，用于举出代表性事物。句意：‘在本校可以学习以英语为首的七种语言。’"
wrong_choice_1 = "「からして」表示‘从……来看／连……都……’，用于推测或评价，语义不符。"
wrong_choice_2 = "「をめぐり」表示‘围绕……（问题）’，常用于争论话题。"
wrong_choice_4 = "「において」表示‘在……地点／场合’，语法功能不合。"
