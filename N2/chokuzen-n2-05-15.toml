id = "chokuzen-n2-05-15"
level = "N2"
mistakes = 2

[question]
text = "姉は３日も寝ないで机に向かっている。あれでは体を（　）。"
choices = ["こわしようがない", "こわしっこない", "こわしかねる", "こわしかねない"]
correct = "こわしかねない"

[grammar]
main = "〜しかねない（有可能会……，多指负面结果）"
related = ["〜ようがない", "〜っこない", "〜かねる"]
tags = [
    "level/N2",
    "grammar/しかねない",
    "function/可能・推量（负面）",
    "pattern/Vます形＋しかねない"
]

# 📘 〜しかねない
# 含义：表示“有可能会……（坏结果）”，常用于警告或担忧语气。
# 接续：動詞ます形去ます＋しかねない
# 例句：無理をすると体をこわしかねない。（勉强下去可能会累坏身体）

# 🚫 〜ようがない
# 含义：没有办法……，根本无法做。
# 例句：住所が分からないから、連絡しようがない。
# 与本题语义完全相反。

# 🚫 〜かねる
# 含义：婉拒、难以做到（多用于敬语场合）。
# 例句：その件についてはお答えしかねます。
