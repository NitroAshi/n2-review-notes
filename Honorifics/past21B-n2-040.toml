id = "past21B-n2-040"
level = "N2"

[question]
text = "店員：「お客様、本日いくつかのお部屋を（　）が、ご希望に合うお部屋はございましたか。」"
choices = ["参りました", "拝見しました", "お越しいただきました", "ご覧いただきました"]
correct = "ご覧いただきました"

[grammar]
main = "尊敬語と謙譲語（見る・行く・来る）"
related = ["ご覧になる／ご覧いただく", "拝見する", "参る", "お越しいただく"]
tags = [
  "level/N2",
  "grammar/敬語",
  "function/尊敬語・謙譲語",
  "pattern/動作主の違い"
]

# --- 各选项解析 ---

# ✅ ご覧いただきました
# 原形：見る
# 種類：尊敬語（尊他語）
# 意味：请您看了／您看过
# 用法：用于尊敬对方的“看”这一动作
# 例文：
#   ・本日は商品をご覧いただき、ありがとうございます。
#   ・こちらの資料をご覧いただけますか。

# ❌ 参りました
# 原形：行く・来る
# 種類：謙譲語（自谦）
# 意味：（我）去了／来了
# 例文：
#   ・昨日伺ったときにお世話になりました。
#   ・ただいま参りました。→ 我来了（对上级）
# 说明：用于说自己“去／来”，不用于尊敬对方。

# ❌ 拝見しました
# 原形：見る
# 種類：謙譲語（自谦）
# 意味：（我）看了
# 例文：
#   ・資料を拝見しました。→ 我看过资料。
# 说明：用于谦称自己看，不用于敬客。

# ❌ お越しいただきました
# 原形：来る
# 種類：尊敬語（尊他語）
# 意味：您光临了
# 例文：
#   ・本日はお越しいただきありがとうございます。
# 说明：用于“您来”而非“您看”，语义不符。

# --- 敬语辨析小结 ---

# 【見る】
#   尊敬語：ご覧になる／ご覧いただく（用于对方）
#   謙譲語：拝見する（用于自己）
# 【行く・来る】
#   尊敬語：お越しになる／おいでになる／お越しいただく
#   謙譲語：伺う／参る
# 敬语判断要点：
#   → 谁在执行动作？
#      - 若是对方（客人、上司）：用尊敬語
#      - 若是自己（说话者）：用謙譲語
