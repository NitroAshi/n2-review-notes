# --- 各选项语法说明 ---

# ✅ 正确选项：まさか
# 意味：表示“没想到竟然…”、“难以置信”、“不可能吧”
# 接续：通常放句首或句中，可与「とは思わなかった」「ないだろう」等搭配
# 例文：
#   ・まさか彼が来るとは思わなかった。→ 真没想到他会来。
#   ・まさかそんなことを言うなんて！→ 真没想到你会说那种话！

# ❌ 一体（いったい）
# 意味：用于疑问句，表示“究竟、到底”；用于反问句时带有责备语气
# 接续：一般接疑问词或疑问句（如「一体何があったの？」）
# 例文：
#   ・一体どうして来なかったの？→ 到底为什么没来？
#   ・一体何を考えているんだ。→ 你到底在想什么？

# ❌ 二度と（にどと） 几乎总是与**否定形式（～ない）**一起使用。
# 意味：“再也不……”（后接否定形式）
# 接续：后续必须为动词否定形（～ない）
# 例文：
#   ・二度と行かない。→ 再也不去了。
#   ・二度とあんな失敗はしない。→ 再也不会犯那样的错误。
# 如果你想表达“再一次”“又一次”，那应该用：
# 表达	含义	例句
# もう一度	再一次（中性）	もう一度説明してください。→ 请再解释一遍。
# 再び（ふたたび）	书面语“再次”	再び挑戦する。→ 再次挑战。

# ❌ かえって
# 意味：“反而、却”，表示结果与预期相反
# 接续：可直接连接句子（副词）
# 例文：
#   ・薬を飲んだら、かえって悪くなった。→ 吃了药反而更严重了。
#   ・助けたつもりが、かえって迷惑をかけた。→ 本想帮忙，反而添了麻烦。
