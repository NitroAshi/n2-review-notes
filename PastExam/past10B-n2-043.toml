id = "past10B-n2-043"
level = "N2"
mistaskes = 2

[question]
text = "さっきご飯を食べた（　）、もうおなかがすいてきた。"
choices = ["すぐのことだが", "ばかりのことだが", "すぐだというのに", "ばかりだというのに"]
correct = "ばかりだというのに"

[grammar]
main = "～たばかりだというのに（逆接）"
related = ["～たばかり", "～というのに", "～のに"]
tags = [
    "level/N2",
    "grammar/たばかりだというのに",
    "function/逆接",
    "pattern/口語表現"
]

# 💬补充说明：
# 「～たばかり」表示“刚刚～”“才刚～”，说明动作刚结束。
# 「～というのに」表示强烈的逆接，意为“明明……却……”，比「のに」语气更强。
# 组合「～たばかりだというのに」＝“明明才刚……却……”
# 本题误选点：「ばかりのことだ」不是固定表达，不能用于时间表示。
