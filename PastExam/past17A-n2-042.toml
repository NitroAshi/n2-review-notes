id = "past17A-n2-042"
level = "N2"

[question]
text = "きれいな鳥がいたので写真を撮りたかったが、かばんからカメラを（　）飛んでいってしまった。"
choices = ["取り出そうとしたまま", "取り出すようにしたまま", "取り出そうとしているうちに", "取り出すようにしているうちに"]
correct = "取り出そうとしているうちに"

[grammar]
main = "意向形（〜（よ）う）＋とする ＋ うちに：『正要/试图……的时候』"
related = ["〜ようにする（努力做到/习惯化）", "〜としたら（刚要……就）", "〜最中に（正在……之中）"]

tags = [
  "level/N2",
  "grammar/意向形＋とする",
  "function/动作未遂・时间关系",
  "pattern/口语表現"
]

# 注释:
# 1) 本题关键：『取り出そうとしているうちに』＝ 正要从包里把相机拿出来的时候（尚未完成），鸟就飞走了。
# 2) 语法名为「（よ）うとする」（意向形＋とする）。五段动词意向形以「おう」结尾，看起来像“そう”：
#    例）行く→行こうとする、取り出す→取り出そうとする；一段动词则是「〜ようとする」：食べる→食べようとする。
# 3) 对比：
#    ・〜ようにする：努力做到/养成习惯（例：毎日早く寝るようにしている）→ 不适合一次性当下动作。
#    ・〜（よ）うとする：试图/正要做（例：出かけようとしたら雨が降った）。
# 4) 选项释义：
#    - 1. 取り出そうとしたまま：保持“曾经试图拿出”的状态，搭配「まま」语义别扭。
#    - 2. 取り出すようにしたまま：「ようにする」= 习惯/努力，和一次事件语境不符。
#    - 3. 取り出そうとしているうちに（正确）：动作未遂+时间点恰当。
#    - 4. 取り出すようにしているうちに：习惯化的“努力去拿”的过程中→ 不合场景。
