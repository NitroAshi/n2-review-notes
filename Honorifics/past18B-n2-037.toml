id = "past18B-n2-037"
level = "N2"

[question]
text = "受付「A社の山下様が受付で（　）。」\n田中「あ、分かりました。すぐ行きます。」"
choices = ["お待ちです", "待っております", "お待ちください", "待っていただけますか"]
correct = "お待ちです"

[grammar]
main = "尊敬語：お＋連用形＋です"
related = ["謙譲語：〜ております", "依頼：〜てください", "依頼：〜ていただけますか"]

tags = [
  "level/N2",
  "grammar/尊敬語",
  "function/敬語・尊他",
  "pattern/お-連用形-です"
]

# 注释：
# - 对外部客人必须用尊敬语而非自谦语。
# - 「お待ちです」是对对方动作的礼貌尊敬表达。
# - 「待っております」属于自谦语，只能用于己方，不能用于外部来访者。
# - 「お待ちください」「待っていただけますか」都是“命令/请求”，不符合语境。
