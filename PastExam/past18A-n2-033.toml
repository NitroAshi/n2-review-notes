id = "past18A-n2-033"
level = "N2"

[question]
text = "昨日泊まったホテルの部屋は、シングルルーム（　）広かった。"
choices = ["ばかりか", "をとわず", "にしては", "かというと"]
correct = "にしては"

[grammar]
main = "にしては"
related = ["わりに(は)", "としては"]

tags = [
  "level/N2",
  "grammar/にしては",
  "function/評価・预期外",
  "pattern/連体修飾"
]

# ---- 补充说明 ----
# 1. にしては：表示“以……来说却……”，与一般印象不同，带有意外评价。
# 2. ばかりか：不仅……而且……。必须有第二个成分，本题不符。
# 3. を問わず（をとわず）：不论……。通常搭配成对名词（男女・国籍等），本题语义不合。
# 4. かというと：用于否定前项并做解释，本句不是反问结构。
# 5. 本句含义：单人房来说意外地宽敞 → 最适合用「にしては」。
