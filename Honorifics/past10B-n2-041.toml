id = "past10B-n2-041"
level = "N2"

[question]
text = "これは「あお湖」の写真です。この湖は、季節によってさまざまな景色を水面に映して私たちの目を（　）。"
choices = ["楽しんでくれます", "楽しんでもらいます", "楽しませてくれます", "楽しませてもらいます"]
correct = "楽しませてくれます"

[grammar]
main = "～させてくれる（使役＋授受）"
related = ["～させてもらう", "～てもらう", "～てくれる"]
tags = [
    "level/N2",
    "grammar/～させてくれる",
    "function/授受表現・使役",
    "pattern/口語表現"
]

# 💬补充说明：
# 「～させてくれる」：别人（或事物）“让我做某事／让我感到……”
# 「～させてもらう」：我“得到别人允许去做某事”
# 区别在于主语立场：
#   くれる → 他人视角，让我受益
#   もらう → 自己视角，接受对方好意
# 本题中「湖」是让我们愉悦的“他方”，因此选「楽しませてくれます」。

# 直接翻译
# くれる＝对方给我好处
# もらう＝我从对方那拿到好处
# 再加上使役时：
# させてくれる＝对方让我做／体验某事
# させてもらう＝我得到允许去做某事
