id = "past17A-n2-044"
level = "N2"

[question]
text = "情報化や国際化が進む現代において、学校の教育がこれまでと（　）。コンピュータなどの新しい教育内容が取り入れられるのも当然の流れだと思う。"
choices = ["同じでいいはずがない", "同じというだけではない", "同じならいいに違いない", "同じにならないことはない"]
correct = "同じでいいはずがない"

[grammar]
main = "〜はずがない（强烈否定・绝不可能）"
related = ["〜ことはない（没有必要）", "〜ことはないことはない（双重否定・部分肯定）"]
tags = [
  "level/N2",
  "grammar/〜はずがない",
  "function/强烈否定",
  "pattern/书面表达"
]

# 注释:
# 【句意】“在信息化与国际化发展的现代社会，学校教育不可能还和以前一样就行。”
#          “引入电脑等新教育内容也是自然的趋势。”
#
# 【语法解释】
# ・〜はずがない：表示“绝不可能〜”，用于强烈否定推测。
#   例：彼がそんなことを言うはずがない → “他不可能说那种话。”
#
# 【选项含义】
# 1. 同じでいいはずがない（正确）：“不可能继续保持不变就行。”→ 否定旧状态。
# 2. 同じというだけではない：“不只是一样而已。”→ 太弱，语气不够。
# 3. 同じならいいに違いない：“如果一样就一定很好。”→ 语义相反。
# 4. 同じにならないことはない：“并非不会变得一样”＝“也可能一样。”→ 双重否定变成肯定，与题意相反。
