id = "past18B-n2-042"
level = "N2"

[question]
text = "私は両親に子供のころから自分がやりたいことを自由に（　）。"
choices = ["やらせてもらってくる", "やらせてくれている", "やらせてもらってきた", "やらせてくれていた"]
correct = "やらせてもらってきた"

[grammar]
main = "使役＋もらう：やらせてもらう（被允许做某事）"
related = [
  "使役：〜させる（让……做）",
  "授受表現：もらう（我得到恩惠）",
  "継続：〜てきた（从过去到现在的持续）"
]

tags = [
  "level/N2",
  "grammar/使役授受",
  "function/许可・受益",
  "pattern/〜させてもらってきた"
]

# 注释：
# - やらせてもらう＝我从对方那里得到“允许做某事”的恩惠。
# - てきた表示“从过去持续到现在”，符合「子供のころから」的时间线。
# - くれる用于对方“主动为我做事”，不用于“允许别人做某事”。
