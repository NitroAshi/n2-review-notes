id = "try-n2-15-15"
level = "N2"

[question]
text = "単位が足りません。（　）君は卒業できないということになります。"
choices = ["もっとも", "すると", "したがって", "それが"]
correct = "したがって"

[grammar]
main = "‘したがって’ 用于表示因果关系，通常翻译为‘因此、所以’，适合用来引出结果。"
related = ["接续助词", "因果", "順接"]
tags = [ "level/N2", "grammar/接续助词", "function/因果", "pattern/口語表現" ]

[options]
1 = "もっとも: 表示‘虽然……但是’，通常用于让步语境，不适合用在此处。"
2 = "すると: 表示‘如果……就……’，用在条件句中，语气上不适合表达因果关系。"
3 = "したがって: 表示‘因此、所以’，适用于因果关系，适合用来引出后果。"
4 = "それが: 表示‘但是、然而’，常用于转折，不适用于这个句子中的因果关系。"

[original_sentence]
text = "単位が足りません。（　）君は卒業できないということになります。"
translation = "学分不足。（　）你将无法毕业。"
