id = "past22A-n2-038"
level = "N2"

[question]
text = "客「これから西森町に行くんですが、どこかおいしい和食のお店はありませんか。」 フロント「西森町に（　）、『さくら』はいかがでしょうか。大変人気のあるお店です。」"
choices = ["伺うんでしたら", "伺いますと", "いらっしゃるんでしたら", "いらっしゃいますと"]
correct = "いらっしゃるんでしたら"

[grammar]
main = "いらっしゃるんでしたら"
related = ["いらっしゃる（尊敬語）", "～んでしたら（柔らかい条件）", "～ますと（硬い条件）"]
tags = [
  "level/N2",
  "grammar/いらっしゃるんでしたら",
  "function/条件・敬語",
  "pattern/接客表現"
]

# 🟩 各选项详解
# 1. 伺うんでしたら：
#    意思：如果我去的话（「伺う」是「行く」的谦让语）
#    ❌ 客人在说要去，不是自己（服务员）去，因此错误。

# 2. 伺いますと：
#    意思：如果我去的话（书面条件表达）
#    ❌ 同上，主语不符，也不自然。

# 3. いらっしゃるんでしたら：
#    意思：如果您要去的话（尊敬语＋柔和条件）
#    ✅ 正确答案，最自然的敬语表达。

# 4. いらっしゃいますと：
#    意思：如果您去的话（敬语＋硬条件）
#    语气过于正式、生硬，不符合接待语气。
