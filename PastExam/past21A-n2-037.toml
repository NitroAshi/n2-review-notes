id = "past21A-n2-037"
level = "N2"

[question]
text = "A「じゃ、来週の打ち合わせも水曜日でいいですか。」 B「あ、スケジュールを（　）ちょっとわからないので、後で連絡します。」"
choices = ["確認していないと", "確認してみないと", "確認しているか", "確認してみるか"]
correct = "確認してみないと"

[grammar]
main = "〜てみないと（＝不〜试试看就不知道）"
related = ["〜てみる", "〜ていないと"]
tags = [
    "level/N2",
    "grammar/〜てみないと",
    "function/推量・条件",
    "pattern/口語・柔らかい表現"
]

# 各选项含义：
# 1. 確認していないと：如果没确认（那就不行）→ 表“应有状态” ❌
# 2. 確認してみないと：不确认看看就不知道 → 表“尝试确认” ✅
# 3. 確認しているか：是否已经确认（疑问语气）→ 不符合句型
# 4. 確認してみるか：要不要确认看看？→ 疑问句风格，不自然

# 🧠迁移学习对照模型：
# 「〜ていないと」＝ 如果没〜，就〜（状态前提）
#   → 用于说明某个规则或条件成立的必要状态。
#   → 例：早く行っていないと間に合わない。
#
# 「〜てみないと」＝ 不〜试试看就不知道（尝试确认）
#   → 用于表示现在还不知道，需要实际去做一下才能判断。
#   → 例：食べてみないと味がわからない。
#
# ✅ 快速判断法：
#   - 句子里有“不确定、要去查/试/看/问” → 「〜てみないと」
#   - 句子里是“必须、否则就不行” → 「〜ていないと」
