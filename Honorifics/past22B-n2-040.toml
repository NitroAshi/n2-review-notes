]

# [translation]
# sentence = "（剧场内的广播）工作人员：谨向各位顾客说明，现在在一楼大厅出售演出宣传册，敬请惠顾。"

# 说明：
# ✅ 「申し上げます」是「言う」的謙譲語（谦让语），用于说话者对听话者表达敬意，
#    意为“敬告、禀告”。常用于正式公告或服务场合的自谦表达。
#    「ご案内申し上げます」＝“谨向各位说明／告知”，非常符合广播、通知的场合语气。
#
# ❌ 「なさいます」是「する」的尊敬語，用于表示尊敬对象的行为，
#    若说「ご案内なさいます」则变成“（您）进行说明”，主语错误。
#
# ❌ 「うけたまわります」是「聞く・承る」的謙譲語，用于表示“恭听、接受”。
#    例如「ご注文をうけたまわります」，但本题是“我方说明”，非“听取”。
#
# ❌ 「おっしゃいます」是「言う」的尊敬語，用于表示“（对方）说”，
#    例如「社長がおっしゃいました」。但此句的主语是工作人员自己，不能用尊敬语。
#
# ✅ 因此「お客様にご案内申し上げます」＝“谨向各位顾客说明／播报”，
#    整句自然正式，非常符合剧场广播场合。
