id = "past21A-n2-038"
level = "N2"
mistakes = 2

[question]
text = "「一つの仕事を少なくとも三年は（　）、どこに行っても何もできない」と言われた。"
choices = ["やり続けられなかったら", "やり続けられなくなっても", "やり始められなかったら", "やり始められなくなっても"]
correct = "やり続けられなかったら"

[grammar]
main = "〜たら（仮定条件）"
related = ["〜ても（逆接条件）", "〜なくなっても", "〜なくなったら"]
tags = [
    "level/N2",
    "grammar/〜たら",
    "function/仮定・条件",
    "pattern/動詞可能形"
]

# 各选项含义：
# 1. やり続けられなかったら：如果不能坚持做下去（假设条件）✅
# 2. やり続けられなくなっても：即使变得不能继续（让步条件）❌
# 3. やり始められなかったら：如果不能开始（假设条件）→ 语义不符
# 4. やり始められなくなっても：即使变得不能开始→ 意义不通

# 🧠迁移学习对照模型：
# 「〜たら」＝ 如果〜就〜（假设条件）
#   例：行けなかっ「たら」連絡してください。
#       → 如果去不了，请联系我。
#
# 「〜ても」＝ 即使〜也〜（让步条件）
#   例：行けなく「ても」行くつもりです。
#       → 即使去不了，也打算去。
#
# 「〜られなくなったら」＝ 如果将来不能〜
# 「〜られなくなっても」＝ 即使已经不能〜
#
# ✅ 快速判断：
#   - “如果……就……” → 「〜たら」
#   - “即使……也……” → 「〜ても」
#   - “变得不能……” → 加「〜なくな〜」
#   - 两者组合 → 看逻辑是“假设”还是“让步”！
