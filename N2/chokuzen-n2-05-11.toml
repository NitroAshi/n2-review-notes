id = "chokuzen-n2-05-11"
level = "N2"

[question]
text = "黄色い花が畑一面に咲いて、まるで黄色いカーペットをしいた（　）。"
choices = ["ことか", "せいだ", "だけある", "かのようだ"]
correct = "かのようだ"

[grammar]
main = "〜かのようだ（好像……一样）"
related = ["〜ようだ", "〜ことか"]
tags = [
    "level/N2",
    "grammar/かのようだ",
    "function/比喻・样态",
    "pattern/普通形＋かのようだ"
]

# 📘 〜かのようだ
# 含义：好像……一样。用于比喻、想象的表达，比「ようだ」更书面。
# 接续：普通形＋かのようだ（ナ形／名词＋である）
# 常与「まるで」「あたかも」连用。
# 例句：まるで夢を見ているかのようだ。（好像在做梦一样）
# 本题中“まるで黄色いカーペットをしいたかのようだ”＝“仿佛铺了一层黄色地毯一样”。

# 🚫 〜ことか, 其中‘多么’要有前面的疑问词体现
# 含义：多么……啊！（表示强烈感叹）
# 接续：疑问词＋普通形＋ことか
# 例句：どんなにうれしかったことか。（多么高兴啊）
# 本题不是感叹，而是比喻，因此不能用ことか。
