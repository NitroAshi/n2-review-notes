id = "past19A-n2-034"
level = "N2"

[question]
text = "私はピアノを弾くことが、好き（　）好き（　）たまらない。"
choices = ["が/が", "に/に", "で/で", "は/は"]
correct = "で/で"

[grammar]
main = "好きで好きでたまらない（感情の強調）"
related = ["形容動詞語幹＋で＋形容動詞語幹＋で", "〜てたまらない"]

tags = [
  "level/N2",
  "grammar/て形（形容動詞）",
  "function/感情強調",
  "pattern/好きで好きでたまらない"
]

# 注释：
# - 「好きで」中的「で」是形容動詞「好きだ」的連用形（て形）「で」。
# - 「好きで好きでたまらない」是固定表达，表示“非常喜欢得不得了”。
# - 「が」「に」「は」都不能连接两个形容动词状态。
