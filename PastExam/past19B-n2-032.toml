id = "past19B-n2-032"
level = "N2"

[question]
text = "「田中さんがこの会社をやめるって話、まだ秘密みたいだから、悪いけど、聞かなかった（　）にしてくれない？」"
choices = ["こと", "だけ", "もの", "の"]
correct = "こと"

[grammar]
main = "〜ないことにする（V-なかったことにする）"
related = ["〜ことにする", "〜ことにしている", "〜ことになる"]
tags = [
  "level/N2",
  "grammar/ないことにする",
  "function/假装・决定・把某事当作…",
  "pattern/口語表現"
]

# 语法说明：
# 「V-なかったことにする」：把“没做这件事”当成事实来看待 → “就当没…过”“算我没…”
# 本题：聞かなかったことにしてくれない？＝“能当作没听见吗？”
#
# 为何不用「の」：
# 「〜ことにする」是整体固定表达，名词化“事情 / 行为”；表示主观决定或装作那样。
# 「〜のにする」一般用于选择具体的东西或类型，如：
#   A: コーヒーにしますか。B: じゃ、紅茶のにします。
# 这里的「の」代指“红茶那个（杯子/种类）”，而不是把整件事情当作一个“事实”来处理。
# 因此，「聞かなかったのにしてくれない」在日语里不自然，不符合既有句型搭配，只能用「こと」。
