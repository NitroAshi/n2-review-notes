id = "past19B-n2-038"
level = "N2"

[question]
text = "今はスポーツも演劇もテレビで見られる時代だが、直接見ることに（　）得られない感動というものがある。"
choices = ["とってしか", "よってしか", "ついてのみ", "対してのみ"]
correct = "よってしか"

[grammar]
main = "〜によって（表示原因・手段・依据）"
related = ["〜により", "〜による", "〜を通じて"]
tags = [
  "level/N2",
  "grammar/によって",
  "function/手段・原因",
  "pattern/書き言葉"
]

# 解析：
# 「〜によって」表示“通过……、由于……”，这里“直接見ることによってしか得られない”意为：
# “只有通过亲眼观看，才能获得的感动”。
# 句意：虽然现在是连体育和戏剧都能在电视上看的时代，但仍有只有亲眼看才能体会到的感动。
#
# 其他选项：
# 1. とってしか：「〜にとって」表示“对……来说”，不能和「しか」连用成这种结构，语法错误。
# 2. よってしか：正确，来自「〜によってしか〜ない」= “只有通过……才能……”，常见固定表达。
# 3. ついてのみ：语法错误，不能这样接。
# 4. 対してのみ：「〜に対して」表示“针对……”，语义不通。
#
# 🔹区别补充：
# 「〜による」是「〜によって」的连体形，用来修饰名词，例如：
#   - 台風による被害（由台风造成的损害）
# 「〜によって」则直接连接动词或句子，例如：
#   - 努力によって成功した（通过努力成功了）
#
# 💡记忆法：
# 「によって」= 通过手段方式（“by / through”）
# 「にとって」= 对于某人立场（“for someone”）
# 混淆时可想成：
#   “よって” ≈ “由……引起 / 通过……”
#   “とって” ≈ “对……来说”
