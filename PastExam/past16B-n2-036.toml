id = "past16B-n2-036"
level = "N2"

[question]
text = "作文が得意な友達に「どうやったらうまくなれるの？」と聞いたら、「たくさん書けば（　）うまくなるよ。」と言われた。"
choices = ["必ずしも", "たとえ", "そのうち", "さっき"]
correct = "そのうち"

[grammar]
main = "そのうち"
related = ["いずれ", "やがて"]
tags = [
  "level/N2",
  "grammar/そのうち",
  "function/时间推移・将来预期",
  "pattern/副詞・口語"
]

# 解説：
# 「そのうち」意思是“过一阵子”“不久”“迟早”，表示经过一段时间后某事会发生。
# 本句「たくさん書けばそのうちうまくなるよ」＝“多写的话，迟早就会写得好”。
# 是非常自然的口语表达。

# 其他选项解释：
# 1. 必ずしも（かならずしも）：表示“并不一定（后多接否定）”。如：必ずしも正しいとは限らない。
# 2. たとえ：表示“即使……也……”，后常接「〜ても」「〜でも」。
# 4. さっき：表示“刚才”，用于过去的短时间，不能与表示未来变化的「うまくなる」呼应。

# 记忆要点：
# 「そのうち」可以修饰将来性的变化或动作，语气比「いずれ」更口语化。
# 例：そのうち雨がやむよ。／そのうち分かるようになるよ。
