id = "past20A-n2-036"
level = "N2"
mistakes = 3 

[question]
text = "毎日日記を書き続けることは、（　）、けっこう難しいことだ。"
choices = ["簡単らしいし", "簡単なようであれば", "簡単らしくて", "簡単なようでいて"]
correct = "簡単なようでいて"

[grammar]
main = "〜ようで（表面上看似〜，但实际上〜）"
related = ["〜ように見える", "〜ようだ", "〜みたい"]
tags = [
  "level/N2",
  "grammar/ようで",
  "function/逆接・印象",
  "pattern/説明・評価"
]

# 解析：
# 「ようで」是本题的核心语法，表示“看起来像〜”或“表面上似乎〜”。
# 当接「〜いて」时，构成「ようでいて」，表示“看似〜其实〜”，常用于表达外观与事实不一致。
#
# 句意：
# 毎日続けて日記を書くことは、簡単なようでいて（看似简单其实难），けっこう難しいことだ。
# → “每天坚持写日记，看起来简单，其实挺难的。”
#
# 接续：
# 名詞／ナ形容詞（＋な）／イ形容詞／動詞普通形 ＋ ようで
#
# 例文：
# ・彼は優しいようでいて、実は冷たい。→ 看似温柔，其实冷淡。
# ・この問題は簡単なようで難しい。→ 看起来简单，其实难。
#
# 英文解释：
# 「〜ようで」＝ *seems / appears to be ... but actually ...*
# 「〜ようでいて」＝ *although it seems ... it actually ...*
