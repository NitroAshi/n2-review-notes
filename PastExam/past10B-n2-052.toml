id = "past10B-n2-052"
level = "N2"

[question]
text = "外出時にはマスクやめがねで花粉が体に入るのを防ぎ、帰宅時に服についた花粉を落としてから、家に（　）。"
choices = ["入ってあげるのでしょう", "入れてあげましょう", "入れるのでしょう", "入りましょう"]
correct = "入りましょう"

[grammar]
main = "～ましょう（意向形・勧誘）"
related = ["～ましょうか", "～てください", "～ましょうね"]
tags = [
    "level/N2",
    "grammar/ましょう",
    "function/勧誘・提案",
    "pattern/書き言葉・説明文"
]

# 💬补充说明：
# 「～ましょう」表示“让我们～吧／请～吧”，用于提出建议或号召。
# 本文是说明文风格，与前面的「～してください」并列自然。
# 「～のでしょう」表示推测，不用于提出建议，因此语气错误。 "大概..."
# 正确句意：帰宅時に花粉を落としてから、家に入りましょう。

# | 语气强度      | 表达          | 中文语感        |
# | --------- | ----------- | ----------- |
# | でしょう（↓）   | “大概～吧。”     | 带判断、陈述气     |
# | でしょうか（↑）  | “～吗？”、“～呢？” | 礼貌地征询对方意见   |
# | でしょうね（带ね） | “是吧？”       | 轻微确认语气      |
# | でしょうよ（带よ） | “肯定是啊！”     | 强调、主张语气（口语） |
