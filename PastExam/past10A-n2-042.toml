id = "past10A-n2-042"
level = "N2"

[question]
text = "人間の脳に関する研究で明らかになったことはまだほんの一部（　）、その研究は着実に進んできた。"
choices = ["にすぎないとすると", "にかかわらないとすると", "にすぎないとはいえ", "にかかわらないとはいえ"]
correct = "にすぎないとはいえ"

[grammar]
main = "～とはいえ（虽说～但～）"
related = ["～にすぎない（不过是～）", "～とすると（如果～）"]
tags = [
    "level/N2",
    "grammar/とはいえ",
    "function/逆接・譲歩",
    "pattern/書き言葉"
]

# 💬補充说明：
# ✅「とはいえ」：表示让步转折＝“虽说～但～”，常用于正式书面语。
# 　　例：学生とはいえ、礼儀を守るべきだ。
# ✅「にすぎない」：表示“不过是～而已”，表达轻微限制或谦逊。
# ❌「とすると」：表示假定或推量＝“如果～那就～”，与句意不符。
# 本句意为“虽说研究揭示的只是很小一部分，但进展稳步”，
# 故正确表达为「にすぎないとはいえ」。
