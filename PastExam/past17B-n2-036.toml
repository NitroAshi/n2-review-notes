id = "past17B-n2-036"
level = "N2"
mistakes = 2 

[question]
text = "毎朝体操を（　）、硬かった体が柔らかくなった。"
choices = ["続けるうちに", "続けるからには", "続けるとすると", "続けるかというと"]
correct = "続けるうちに"

[grammar]
main = "〜うちに：在…（持续状态）过程中，逐渐自然地变化；表示无意识、渐变的结果。"
related = ["〜ているうちに", "〜からには（既然…就必须）", "〜とすると（假设）", "〜かというと（谈论对比、否定）"]
tags = [
  "level/N2",
  "grammar/うちに",
  "function/自然変化・渐变",
  "pattern/副詞句・連用修飾"
]

# 选项释义
# 1. 続けるうちに：表示在持续做体操的过程中，自然而然地身体变柔软了（本题语境完全对应）。
# 2. 続けるからには：既然要继续做，就必须…；带义务/决心色彩，与“自然变柔软”无关。
# 3. 続けるとすると：若假设继续做的话…（假设推量），不符合描述事实的语境。
# 4. 続けるかというと：要说是否继续做的话…（用于对比否定），不适合本句结构。
