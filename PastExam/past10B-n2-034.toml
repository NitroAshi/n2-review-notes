id = "past10B-n2-034"
level = "N2"

[question]
text = "新作映画について中田一郎監督は、「現実的で（　）ながらも、詩的な雰囲気を失わないよう意識した。」と語る。"
choices = ["あり", "ある", "なり", "なる"]
correct = "あり"

[grammar]
main = "ながら（逆接：虽然……却……）"
related = ["でありながら", "Vます形＋ながら（逆接）", "～つつ（逆接/书面）", "～ものの"]
tags = [
  "level/N2",
  "grammar/ながら",
  "function/逆接",
  "pattern/書き言葉"
]

# 备注与对比：
# 1) ながら有两个常见用法：
#    a. 同时进行：Vます形＋ながら＝一边……一边……（例：音楽を聞きながら勉強する）
#    b. 逆接让步：Vます形＋ながら／名詞・ナ形＋であり＋ながら＝虽然……却……
# 2) 本题是逆接用法，且前项为ナ形容词「現実的だ」→ 連用形「現実的で」，
#    与「ある」的連用形「あり」结合成「であり」→「でありながら」。
# 3) 误选点：
#    - ある：不能直接接「ながら」在此形成「である」的連用，应为「で＋あり＋ながら」。
#    - なり：是接续用法「Vるなり」（一……就……），与本句义不符。
#    - なる：动词原形，无法与前面的「で」构成书面连用结构。
