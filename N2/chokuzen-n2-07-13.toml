id = "chokuzen-n2-07-13"
level = "N2"

[question]
text = "この町には心をなごませる（　）。"
choices = ["ものだ", "ものか", "ものがある", "ものではない"]
correct = "ものがある"

[grammar]
main = "〜ものがある（表示某种感情或现象的存在）"
related = ["〜ものだ", "〜ものか", "〜ものではない"]
tags = [
  "level/N2",
  "grammar/ものがある",
  "function/存在感情・现象",
  "pattern/口語表現"
]

[notes]
"ものだ" = "表示普遍的道理或习惯（例：人は無いものを欲しがるものだ）。本句并不是描述普遍规律，因此不合适。"
"ものか" = "用于强烈否定，表示‘怎么可能’（例：こんなことができるものか！）。本句没有否定语气，错误。"
"ものがある" = "表示某种感情或现象的存在（例：心をなごませるものがある）。✅正确。"
"ものではない" = "表示‘不应该’（例：そんなことをするものではない）。本句不是否定或建议，错误。"

[words]
"なごませる" = "使~变得温和、宁静、放松。用于描述缓和情绪或让心情变得平静的行为。例：心をなごませる（让心情变得平静）。"
