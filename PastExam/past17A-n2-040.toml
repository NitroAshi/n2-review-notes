[question]
text = "課長「田中さん、さっき頼んだ書類の整理ですけど、今週は出張もあって忙しいでしょうし、特に急ぎじゃないので、来週（　）お願いします。」"
choices = ["なら", "にでも", "でなら", "ででも"]
correct = "にでも"

[grammar]
main = "〜にでも（宽泛容许・委婉建议）"
related = ["〜でも", "〜ででも"]
tags = [
  "level/N2",
  "grammar/〜にでも",
  "function/委婉请求・容许",
  "pattern/口语表达"
]

# 注释:
# 「〜にでも」表示“在……时候也行”“什么时候都可以”的柔和语气。
# 用于提出建议、请求时让对方自由安排时间或情况。(に表示下周，でも表示什么什么之类的列举)
# 「ででも」则表示“即使用……方式也要”，带有强调手段的强烈语气。
# 例: 「明日ででも行きます」→“哪怕明天也要去（强调）”
# 本题语境是上司对下属委婉请托，因此选「にでも」最自然。
