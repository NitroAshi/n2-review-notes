id = "try-n2-08-03"
level = "N2"

[question]
text = "運転免許証（　）健康保険証など、身分を証明するものをご持参ください。"
choices = ["あるいは", "すなわち", "ただし", "もっとも"]
correct = "あるいは"

[grammar]
main = "‘あるいは’ 用于列举并列的内容，表示‘或者、或者是’，用于选择或并列关系。"
related = ["接续助词", "并列", "列举"]
tags = [ "level/N2", "grammar/接续助词", "function/并列", "pattern/口語表現" ]

[options]
1 = "あるいは: 表示‘或者、或者是’，用于列举并列内容，适合在此句中连接‘驾驶执照’和‘健康保险证’。"
2 = "すなわち: 表示‘即、换句话说’，用于解释说明前面内容，不适合用于列举。"
3 = "ただし: 表示‘但是、不过’，通常用于转折或限制条件，不能用于列举。"
4 = "もっとも: 表示‘虽然、不过’，用于补充说明或让步语气，也不适合列举。"

