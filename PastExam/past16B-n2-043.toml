id = "past16B-n2-043"
level = "N2"

[question]
text = "せっかく、夕日がきれいなことで有名なA海岸に来たのに、急に雨が降り出した。どうも夕日は（　）。"
choices = ["見えてもしかたない", "見られないことだった", "見られそうにない", "見えないことがあった"]
correct = "見られそうにない"

[grammar]
main = "〜そうにない"
related = ["〜そうだ（様態）", "〜そうもない"]
tags = [
  "level/N2",
  "grammar/〜そうにない",
  "function/可能性否定・推量",
  "pattern/動ます形＋そうにない"
]

# 解説：
# 「〜そうにない」表示“看起来不太可能〜”“似乎〜不了”，
# 是「〜そうだ」的否定形式，用于表达说话人从情况判断出“某事大概不会发生”。
# 
# ✅ 句意：
# 「どうも夕日は見られそうにない。」＝“看来是看不到夕阳了。”
# 整句意思是：“好不容易来到了以夕阳美丽著称的A海岸，结果突然下起雨来。看来这次是看不到夕阳了。”
#
# ✳️语法结构：
# 動詞ます形＋そうにない
# 表示“似乎不会……”“看来无法……”
# 例：
# ・この分では間に合いそうにない。（照这样看来赶不上了）
# ・彼は来そうにない。（看样子他不会来了）

# ❌ 误选解析：
# 4. 見えないことがあった：
# 表示“曾有看不见的时候”，描述过去的具体经历，
# 与本句的“当前情况判断（看起来不行了）”不符。
#
# 2. 見られないことだった：
# 表示“是看不到的事情”，语法不自然，不用于这种情境。
# 1. 見えてもしかたない：
# “即使看见也没办法”，语义完全不符。

# 💡记忆要点：
# 「〜そうだ」＝“看起来会〜”
# 「〜そうにない」＝“看起来不会〜”
# 「〜そうもない」语气更强（几乎不可能）。
#
# 例：
# ・雨がやみそうにない。→ 看样子雨停不了了。
# ・彼は合格しそうにない。→ 看来他考不过了。
