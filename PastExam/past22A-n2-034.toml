id = "past22A-n2-034"
level = "N2"

[question]
text = "A：「ねえ、経済学のレポート書けた？」 B：「うん、難しかったけど、（　）書いたよ。」"
choices = ["書けば", "書いてでも", "書くだけは", "書いたわりに"]
correct = "書くだけは"

[grammar]
main = "～だけは～た"
related = ["～だけ", "～くらいは", "～にしては"]
tags = [
  "level/N2",
  "grammar/だけは",
  "function/最低限・限定",
  "pattern/口語表現"
]

# 🟩 各选项详解
# 1. 書けば：
#    意思：如果写的话（假定条件）
#    例句：書けばわかるよ。→ 写了就会懂。
#    ❌ 本句不是假设句，而是事实陈述。

# 2. 書いてでも：
#    意思：即使……也要……（表示强烈意志）
#    例句：借金してでも行きたい。→ 就算借钱也要去。
#    ❌ 语气太强烈，不符“至少做了”的语感。

# 3. 書くだけは：
#    意思：至少……还是做了（表达最低限的完成）
#    例句：行くだけは行った。→ 去是去了。
#    ✅ 正确答案。

# 4. 書いたわりに：
#    意思：虽然……却……（与预期不符）
#    例句：高いわりに質が悪い。→ 虽然贵但质量差。
#    ❌ 本句无比较语境，不自然。
