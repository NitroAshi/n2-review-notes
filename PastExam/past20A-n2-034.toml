id = "past20A-n2-034"
level = "N2"

[question]
text = "上司「セミナー会場の準備はどう？ 順調？」\n\n部下「ええ、いすも並べ終わりましたし、（　）資料を受付に運ぶだけです。」"
choices = ["特に", "あとは", "少しも", "あまりに"]
correct = "あとは"

[grammar]
main = "あとは〜だけだ：表示前面的步骤已经完成，‘剩下只要〜就可以了’的意思。常用于会话。"
related = ["〜だけだ", "もう〜だけだ", "〜ばかりだ"]
tags = [
  "level/N2",
  "grammar/あとは〜だけだ",
  "function/剩余作业・步骤",
  "pattern/会话表达"
]

# 补充说明（中文）：
# ・少しも：必须和否定一起用，“一点也不〜”。不能和肯定形连用。
# ・特に：意思是“特别、尤其”，不能表示“剩下的步骤”。
# ・あまりに：表示“过于〜”，接形容词/动词，用在这里不自然。
