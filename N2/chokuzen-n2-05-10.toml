id = "chokuzen-n2-05-10"
level = "N2"

[question]
text = "彼女の考え方や行動は、普通の人からは理解（　）。"
choices = ["しろ", "しがたい", "しかねない", "しかない"]
correct = "しがたい"

[grammar]
main = "〜しがたい（难以……，不容易……）"
related = ["〜しかねない", "〜しかない"]
tags = [
    "level/N2",
    "grammar/しがたい",
    "function/可能・困难",
    "pattern/Vます形＋がたい"
]

# 📘 〜しがたい
# 含义：难以……、不容易……。多用于心理、感情、道德上难以做到的事。
# 接续：動詞ます形去ます＋がたい
# 例句：信じがたい話だ。（难以置信的事）
# 本题「理解しがたい」＝难以理解。

# 🚫 〜しかねない
# 含义：有可能会……（多指负面结果）
# 例句：そんな言い方では誤解を招きかねない。
# 本题不是“可能～”，而是“难以～”。

# 🚫 〜しかない
# 含义：只好……／只能……，表示无奈选择。
# 例句：助けを求めるしかない。
# 本题不是无奈语气，而是表达困难。
