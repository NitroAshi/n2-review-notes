id = "past21A-n2-040"
level = "N2"

[question]
text = "（受付で）山川「すみません。ABC社の山川と申しますが、営業部の中西さんをお願いします。」受付「申し訳ございません。中西はただいま外出しておりますが。」山川「え、中西さんご本人から、この時間だったらいらっしゃると（　）が。」"
choices = ["お聞きになったんです", "申し上げたんです", "ご存じなんです", "伺ったんです"]
correct = "伺ったんです"

[grammar]
main = "伺う（＝聞く・訪ねる的謙譲語）"
related = ["お聞きになる", "申し上げる", "ご存じだ", "存じている"]
tags = [
    "level/N2",
    "grammar/敬語",
    "function/謙譲語",
    "pattern/ビジネス会話"
]

# 各选项含义：
# 1. お聞きになったんです：听说（尊敬语）→ 对别人说用，不可用于自己 ❌
# 2. 申し上げたんです：说了（謙譲語）→ 意义不符，动词错误 ❌
# 3. ご存じなんです：知道（尊敬语）→ 不能用于自己 ❌
# 4. 伺ったんです：听到／请教（謙譲語）→ 对自己动作自谦 ✅

# 🌸敬語体系速记：
# 尊敬語（相手↑）：お〜になる、ご〜なさる、いらっしゃる、おっしゃる、ご存じだ
# 謙譲語（自分↓）：伺う、申し上げる、存じている、参る
# 丁寧語（文末敬体）：〜です、〜ます
#
# ✅快速判断法：
#   - 主语是“我／我们” → 用謙譲語（伺う、申し上げる）
#   - 主语是“对方／上司” → 用尊敬語（お聞きになる、ご存じ）
#   - 主语不明但结尾礼貌 → 用丁寧語（〜です／〜ます）
