id = "past19B-n2-036"
level = "N2"

[question]
text = "司会「ご来場の皆様、本日は第3回桜教育講演会に（　）、ありがとうございます。」"
choices = ["まいり", "ご覧になり", "お目にかかり", "おいでくださり"]
correct = "おいでくださり"

[grammar]
main = "おいでくださる（尊敬語）"
related = ["いらっしゃる", "お越しくださる", "お見えになる"]
tags = [
  "level/N2",
  "grammar/おいでくださる",
  "function/尊敬語",
  "pattern/丁寧表現"
]

# 解析：
# 「おいでくださり」是「おいでくださる」的连用形，用于表达“前来参加”“光临”的尊敬语。
# 句意：「感谢各位今天光临第三回樱花教育讲演会」。
# 适用于正式场合（例如司会、典礼、会议开场致辞等），体现对听众的敬意。
#
# 其他选项：
# 1. まいり → 「参る」是自谦语，表示“我来”，不可能用于敬语感谢听众。
# 2. ご覧になり → 「見る」的尊敬语，但这里讲的是“来会场”，不是“看”。
# 3. お目にかかり → 「会う」的自谦语，用于“我见到您”，不符合主语（听众）是尊敬对象的情况。
# 因此只有 4.「おいでくださり」正确。
