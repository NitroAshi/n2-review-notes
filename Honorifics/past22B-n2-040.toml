id = "past22B-n2-040"
level = "N2"

[question]
text = "（劇場内のアナウンスで）\nスタッフ「お客様にご案内（　）、ただいま、1階ロビーにおいて、公演パンフレットを販売しております。ぜひご利用ください。」"
choices = ["なさいます", "うけたまわります", "申し上げます", "おっしゃいます"]
correct = "申し上げます"

[grammar]
main = "申し上げます（謙譲語）"
related = ["申します", "申し上げる"]
tags = [
  "level/N2",
  "grammar/申し上げます",
  "function/敬語・謙譲語",
  "pattern/動詞謙譲形",
