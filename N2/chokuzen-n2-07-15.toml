id = "chokuzen-n2-07-15"
level = "N2"
mistakes = 2

[question]
text = "インターネットでご予約の（　）には、パスワードが必要となります。"
choices = ["最中", "際", "たび", "かわり"]
correct = "たび"

[grammar]
main = "〜たび（表示每当～时）"
related = ["〜さい", "〜のさい", "〜最中"]
tags = [
  "level/N2",
  "grammar/たび",
  "function/每当～时",
  "pattern/口語・書き言葉"
]

[notes]
"最中" = "表示‘正在……时’，例如：会議の最中に電話がかかってきた。此句不合适，因为没有描述正在进行时。"
"際" = "表示‘在……的时候’，常用于书面语中，和‘に’搭配（例：お手洗いに行く際は、鍵をかけてください）。本句也能使用，但‘たび’更自然。"
"たび" = "表示‘每当～时’，用于描述每次某事发生时都会有相应的情况发生（例：旅行のたびにお土産を買う）。✅"
"かわり" = "表示‘替代’（例：お金のかわりにプレゼントをあげた）。不适用于此句。"
